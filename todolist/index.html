   CULTURE VIEW
══════════════════════════════════════════ */
function renderCultures(){
  const area=document.getElementById('cultureArea');
  area.innerHTML='';

  const toolbar=document.createElement('div');
  toolbar.className='asset-toolbar';
  toolbar.innerHTML=`<span class="asset-toolbar-title">Sejarah Organisasi</span>`;
  if(role==='admin'){
    const btn=document.createElement('button');
    btn.className='task-add-inline-btn';
    btn.textContent='＋ Tambah Sejarah';
    btn.addEventListener('click',()=>openModal('culture-add',{}));
    toolbar.appendChild(btn);
  }
  area.appendChild(toolbar);

  const cultures=db.cultures||[];
  if(!cultures.length){
    const e=document.createElement('div');
    e.className='asset-empty';
    e.textContent='Belum ada catatan sejarah organisasi.';
    area.appendChild(e); return;
  }

  /* Sort: has date → by date asc; no date → by createdAt asc. Newest at top = reverse. */
  const sorted=[...cultures].sort((a,b)=>{
    const ka=a.date||new Date(a.createdAt).toISOString().slice(0,10);
    const kb=b.date||new Date(b.createdAt).toISOString().slice(0,10);
    return ka<kb?-1:ka>kb?1:0;
  });

  const MONTH=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
  function fmtDate(d){
    if(!d) return null;
    const [y,m,dd]=d.split('-');
    return `${parseInt(dd)} ${MONTH[parseInt(m)-1]} ${y}`;
  }

  const BADGE_LABEL={internal:'🏠 Internal',eksternal:'🌐 Eksternal',kolaborasi:'🤝 Kolaborasi'};

  const tl=document.createElement('div');
  tl.className='culture-timeline';

  /* Rendered bottom-to-top visually: oldest at bottom → render reversed in DOM, then CSS flex-col-reverse */
  tl.style.display='flex';
  tl.style.flexDirection='column-reverse';

  sorted.forEach((c,i)=>{
    const side=i%2===0?'tl-left':'tl-right';
    const item=document.createElement('div');
    item.className=`culture-timeline-item ${side}`;

    const dot=document.createElement('div');
    dot.className='culture-tl-dot';

    const card=document.createElement('div');
    card.className='culture-tl-card';

    const dateStr=fmtDate(c.date);
    const badgeHtml=c.type&&BADGE_LABEL[c.type]?`<div class="culture-tl-badge ${c.type}">${BADGE_LABEL[c.type]}</div>`:'';
    const descHtml=c.description?`<div class="culture-tl-desc">${esc(c.description)}</div>`:'';
    const actsHtml=role==='admin'?`<div class="culture-tl-acts">
      <button class="asset-act-btn" data-culture-edit="${c.id}">✎</button>
      <button class="asset-act-btn del" data-culture-del="${c.id}">✕</button>
    </div>`:'';

    card.innerHTML=`
      ${badgeHtml}
      ${dateStr?`<div class="culture-tl-date">${dateStr}</div>`:''}
      <div class="culture-tl-title">${esc(c.title)}</div>
      ${descHtml}
      ${actsHtml}
    `;
    card.querySelector('[data-culture-edit]')?.addEventListener('click',()=>openModal('culture-edit',{id:c.id}));
    card.querySelector('[data-culture-del]')?.addEventListener('click',()=>{
      if(!confirm(`Hapus "${c.title}"?`)) return;
      db.cultures=db.cultures.filter(x=>x.id!==c.id); save(); renderCultures();
    });

    item.appendChild(card);
    item.appendChild(dot);
    tl.appendChild(item);
  });

  area.appendChild(tl);
}

/* ══════════════════════════════════════════
   FORCE SEND NOTIFICATION
══════════════════════════════════════════ */
async function forceSendNotif(btn){
  const pat = localStorage.getItem('rak_alteco_pat');
  if(!pat){ alert('PAT tidak ditemukan. Login ulang sebagai superadmin terlebih dahulu.'); return; }

  const origText = btn.textContent;
  btn.textContent = 'Memicu...';
  btn.disabled = true;

  try {
    const resp = await fetch(
      'https://api.github.com/repos/dionisiusnp/dionisiusnp.github.io/actions/workflows/daily-notif.yml/dispatches',
      {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${pat}`,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ ref: 'main', inputs: { force: 'true' } })
      }
    );
    if(resp.status === 204){
      btn.textContent = '✓ Dipicu';
      setTimeout(()=>{ btn.textContent=origText; btn.disabled=false; }, 3000);
    } else if(resp.status === 403 || resp.status === 401){
      throw new Error('PAT tidak punya scope "workflow". Buat PAT baru dengan scope gist + workflow.');
    } else {
      const body = await resp.text();
      throw new Error(`HTTP ${resp.status}: ${body}`);
    }
  } catch(e) {
    alert('Gagal memicu notif: ' + e.message);
    btn.textContent = origText;
    btn.disabled = false;
  }
}

/* ══════════════════════════════════════════
   NOTIFICATION HELPERS
══════════════════════════════════════════ */
function getTodayEvents(){
  const now = new Date();
  const today = now.toISOString().slice(0,10);
  const globalDaysBefore = db.settings?.notifDaysBefore ?? 1;
  return (db.events||[]).filter(ev=>{
    if(ev.type==='once'){
      if(!ev.date) return false;
      const start = new Date(ev.date+'T00:00:00');
      start.setDate(start.getDate()-globalDaysBefore);
      return today>=start.toISOString().slice(0,10) && today<=ev.date;
    }
    if(ev.type==='recurring'){
      if(ev.recurrence==='harian') return true;
      /* berulang: notif hanya PADA hari H sesuai recurDate */
      const base = ev.recurDate ? new Date(ev.recurDate+'T00:00:00') : null;
      if(ev.recurrence==='mingguan')
        return base ? now.getDay()===base.getDay() : now.getDay()===1;
      if(ev.recurrence==='bulanan')
        return base ? now.getDate()===base.getDate() : now.getDate()===1;
      if(ev.recurrence==='tahunan')
        return base ? (now.getMonth()===base.getMonth()&&now.getDate()===base.getDate()) : false;
    }
    return false;
  });
}

function updateBellBadge(){
  const lastRead = parseInt(localStorage.getItem('alteco_info_read_ts')||'0');
  const unread = (db.events||[]).filter(ev=>Math.max(ev.createdAt||0, ev.updatedAt||0)>lastRead).length;
  const badge = document.getElementById('bellBadge');
  if(!badge) return;
  if(unread>0){ badge.textContent=unread; badge.style.display='flex'; }
  else badge.style.display='none';
}

function checkLocalNotif(){
  if(db.settings?.pushNotifEnabled) return;
  if(!('Notification' in window)) return;
  const today = new Date().toISOString().slice(0,10);
  const lastKey = 'alteco_notif_date';
  if(localStorage.getItem(lastKey)===today) return;

  const todayEvents = getTodayEvents();
  if(!todayEvents.length) return;

  function showNotifs(){
    localStorage.setItem(lastKey, today);
    todayEvents.forEach(ev=>{
      new Notification('📌 Alteco — '+ev.title, {
        body: ev.desc||'Event hari ini',
        icon: '/favicon.ico'
      });
    });
    updateBellBadge();
  }

  if(Notification.permission==='granted'){
    showNotifs();
  } else if(Notification.permission!=='denied'){
    Notification.requestPermission().then(p=>{ if(p==='granted') showNotifs(); });
  }
}

/* ══════════════════════════════════════════
   ONESIGNAL
══════════════════════════════════════════ */
function initOneSignal(){
  if(!db.settings?.pushNotifEnabled) return;
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({ appId: ONESIGNAL_APP_ID, notifyButton: { enable: false } });
  });
}

function loadOneSignalSDK(){
  if(document.getElementById('onesignal-sdk')) return;
  const s=document.createElement('script');
  s.id='onesignal-sdk';
  s.src='https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js';
  s.defer=true;
  s.onload=()=>initOneSignal();
  document.head.appendChild(s);
}
