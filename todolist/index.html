<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Kelola Alteco</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0b12;--surface:#12121c;--card:#181825;--bd:#23233a;
  --text:#e2e2f0;--muted:#9494b8;--dim:#5c5c7a;
  --accent:#6c6ff5;--accent2:#a78bfa;
  --green:#34d399;--red:#f87171;--gold:#fbbf24;--blue:#60a5fa;--teal:#2dd4bf;
  --font:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
}
[data-theme="light"]{
  --bg:#f4f4f9;--surface:#eaeaef;--card:#dfdfec;--bd:#c5c5d4;
  --text:#15152a;--muted:#6a6a88;--dim:#9090aa;
  --accent:#5356d1;--accent2:#8b5cf6;
  --green:#059669;--red:#dc2626;--gold:#ca8a04;--blue:#2563eb;--teal:#0d9488;
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;transition:background .25s,color .25s}
input,button,select,textarea{font-family:var(--font)}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

/* ── Gate ── */
#gate{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;transition:background .25s}
#gate.hidden{display:none}
.gate-box{background:var(--surface);border:1px solid var(--bd);border-radius:12px;padding:40px 36px;max-width:340px;width:100%;text-align:center}
.gate-ico{font-size:2rem;margin-bottom:14px}
.gate-org{font-size:1.2rem;font-weight:900;letter-spacing:-.03em;margin-bottom:4px}
.gate-sub{font-size:.72rem;color:var(--muted);margin-bottom:24px;transition:color .25s}
.gate-input{width:100%;padding:10px 14px;border-radius:7px;border:1px solid var(--bd);background:var(--card);color:var(--text);font-family:var(--mono);font-size:1rem;letter-spacing:.2em;text-align:center;outline:none;transition:border-color .15s,background .25s;margin-bottom:10px}
.gate-input:focus{border-color:var(--accent)}
.gate-input.error{border-color:var(--red);animation:shake .3s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.gate-btn{width:100%;padding:10px;border-radius:7px;border:none;background:var(--accent);color:#fff;font-weight:700;font-size:.85rem;transition:background .15s}
.gate-btn:hover{background:var(--accent2)}
.gate-err{font-size:.7rem;color:var(--red);margin-top:8px;min-height:14px}

/* ── Modal ── */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal.hidden{display:none}
.modal-overlay{position:absolute;inset:0;background:rgba(0,0,0,.65)}
.modal-box{position:relative;background:var(--surface);border:1px solid var(--bd);border-radius:12px;width:100%;max-width:420px;max-height:90vh;display:flex;flex-direction:column;z-index:1;transition:background .25s}
.modal-head{display:flex;align-items:center;padding:16px 20px 12px;border-bottom:1px solid var(--bd);transition:border-color .25s}
.modal-title{font-size:.9rem;font-weight:800;flex:1}
.modal-close{width:26px;height:26px;border-radius:5px;border:1px solid var(--bd);background:var(--card);color:var(--muted);font-size:.8rem;display:flex;align-items:center;justify-content:center;transition:all .15s}
.modal-close:hover{background:var(--red);border-color:var(--red);color:#fff}
.modal-body{padding:18px 20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;flex:1;min-height:0}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-label{font-size:.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.form-input,.form-select,.form-textarea{padding:8px 12px;border-radius:7px;border:1px solid var(--bd);background:var(--card);color:var(--text);font-size:.82rem;outline:none;transition:border-color .15s,background .25s;width:100%}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent)}
.form-textarea{resize:vertical;min-height:60px;max-height:120px}
.repeater{display:flex;flex-direction:column;gap:8px}
.repeater-row{display:flex;gap:6px;align-items:flex-start;background:var(--surface);border:1px solid var(--bd);border-radius:8px;padding:10px 10px 10px 12px;transition:border-color .15s}
.repeater-row:hover{border-color:var(--accent)}
.repeater-fields{flex:1;display:flex;flex-direction:column;gap:6px}
.repeater-del{flex-shrink:0;width:26px;height:26px;border-radius:5px;border:1px solid var(--bd);background:transparent;color:var(--dim);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;margin-top:1px}
.repeater-del:hover{border-color:var(--red);color:var(--red)}
.repeater-add{align-self:flex-start;margin-top:2px;font-size:.72rem;font-weight:600;padding:4px 12px;border-radius:6px;border:1px dashed var(--bd);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s}
.repeater-add:hover{border-color:var(--accent);color:var(--accent)}
input[type="date"].form-input{color-scheme:dark}
[data-theme="light"] input[type="date"].form-input{color-scheme:light}
.form-select option{background:var(--card)}
.type-toggle{display:flex;gap:6px}
.type-btn{flex:1;padding:8px;border-radius:7px;border:1px solid var(--bd);background:var(--card);color:var(--muted);font-size:.78rem;font-weight:600;transition:all .15s;text-align:center}
.type-btn.active-recurring{background:rgba(108,111,245,.15);border-color:rgba(108,111,245,.4);color:var(--accent)}
.type-btn.active-once{background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.35);color:var(--gold)}
.recur-row{display:flex;gap:6px;flex-wrap:wrap}
.recur-opt{font-size:.68rem;font-weight:600;padding:3px 10px;border-radius:4px;border:1px solid var(--bd);background:var(--card);color:var(--muted);cursor:pointer;transition:all .15s}
.recur-opt.active{background:rgba(108,111,245,.15);border-color:rgba(108,111,245,.4);color:var(--accent)}
.modal-foot{flex-shrink:0;display:flex;gap:8px;padding:12px 20px 18px;justify-content:flex-end;border-top:1px solid var(--bd)}
.btn-cancel{padding:8px 16px;border-radius:7px;border:1px solid var(--bd);background:transparent;color:var(--muted);font-size:.78rem;font-weight:600;transition:all .15s}
.btn-cancel:hover{border-color:var(--text);color:var(--text)}
.btn-save{padding:8px 18px;border-radius:7px;border:none;background:var(--accent);color:#fff;font-size:.78rem;font-weight:700;transition:background .15s}
.btn-save:hover{background:var(--accent2)}

/* ── Nav ── */
.nav{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--bd);transition:background .25s,border-color .25s}
.nav-back{font-size:.72rem;font-weight:600;color:var(--muted);padding:4px 12px;border:1px solid var(--bd);border-radius:5px;text-decoration:none;transition:color .15s,border-color .15s}
.nav-back:hover{color:var(--accent);border-color:var(--accent)}
.nav-title{font-size:.82rem;font-weight:700}
.nav-spacer{flex:1}
.nav-role-badge{font-size:.6rem;font-weight:700;padding:2px 8px;border-radius:10px;border:1px solid;letter-spacing:.05em;text-transform:uppercase}
.nav-role-badge.admin{background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.35);color:var(--gold)}
.nav-role-badge.viewer{background:rgba(148,148,184,.08);border-color:var(--bd);color:var(--dim)}
.theme-btn{width:30px;height:30px;border-radius:6px;border:1px solid var(--bd);background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s;font-size:14px;line-height:1}
.theme-btn:hover{background:var(--accent);border-color:var(--accent)}

/* ── App ── */
.app{flex:1;display:flex;overflow:hidden}

/* ── Sidebar ── */
.sidebar{width:210px;flex-shrink:0;border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden;background:var(--surface);transition:background .25s,border-color .25s}
.sidebar-head{padding:10px 12px 6px;flex-shrink:0;display:flex;align-items:center;transition:border-color .25s}
.feature-nav{display:flex;flex-direction:column;gap:2px;padding:4px 6px 6px;flex-shrink:0;border-bottom:1px solid var(--bd);transition:border-color .25s}
.feature-nav-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;border:none;background:transparent;color:var(--muted);cursor:pointer;text-align:left;width:100%;transition:background .15s,color .15s;font-size:.78rem;font-weight:500}
.feature-nav-item:hover{background:var(--card);color:var(--text)}
.feature-nav-item.active{background:rgba(108,111,245,.12);color:var(--accent);font-weight:600}
.feature-nav-ico{font-size:.9rem;flex-shrink:0;width:18px;text-align:center}
.feature-nav-label{flex:1}
.sidebar-head-title{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);flex:1}
.add-btn{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:4px;border:1px solid var(--bd);background:var(--card);color:var(--muted);transition:all .15s}
.add-btn:hover{border-color:var(--accent);color:var(--accent)}
.admin-only{display:none!important}
body.is-admin .admin-only{display:flex!important}
.viewer-only{display:flex}
body.is-admin .viewer-only{display:none!important}

.all-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;margin:6px 6px 2px;border:1px solid transparent;transition:background .15s}
.all-item:hover{background:var(--card)}
.all-item.active{background:rgba(108,111,245,.12);border-color:rgba(108,111,245,.25)}
.all-item.active .all-label{color:var(--accent)}
.all-avatar{width:26px;height:26px;border-radius:50%;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:.68rem;flex-shrink:0}
.all-item.active .all-avatar{background:rgba(108,111,245,.2);border:1px solid rgba(108,111,245,.35)}
.all-label{font-size:.78rem;font-weight:700;flex:1}
.all-count{font-size:.6rem;font-family:var(--mono);color:var(--dim)}

.divider{height:1px;background:var(--bd);margin:4px 10px;transition:background .25s}
.people-scroll{flex:1;overflow-y:auto;padding:4px 6px 6px}

.kelompok-block{margin-bottom:4px}
.kelompok-label{display:flex;align-items:center;gap:5px;padding:6px 10px 3px;font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.kelompok-chevron{font-size:.5rem;flex-shrink:0;transition:transform .2s;display:inline-block}
.kelompok-body{overflow:hidden}
.kelompok-name-text{flex:1}
.grp-actions{display:flex;gap:2px;align-items:center;opacity:0;transition:opacity .15s}
.kelompok-label:hover .grp-actions{opacity:1}
.grp-act-btn{width:16px;height:16px;border-radius:3px;border:none;background:transparent;color:var(--dim);font-size:.6rem;display:flex;align-items:center;justify-content:center;transition:color .15s}
.grp-act-btn:hover{color:var(--text)}
.grp-act-btn.del:hover{color:var(--red)}

.member-item{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:6px;cursor:pointer;border:1px solid transparent;transition:background .15s}
.member-item:hover{background:var(--card)}
.member-item.active{background:rgba(108,111,245,.12);border-color:rgba(108,111,245,.25)}
.member-item.active .member-name{color:var(--accent)}
.member-avatar{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;flex-shrink:0;background:var(--bd);color:var(--text)}
.member-item.active .member-avatar{background:rgba(108,111,245,.2);border:1px solid rgba(108,111,245,.35);color:var(--accent)}
.member-info{flex:1;min-width:0}
.member-name{font-size:.75rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member-role{font-size:.6rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .25s}
.member-task-count{font-size:.58rem;font-family:var(--mono);color:var(--dim);flex-shrink:0}
.member-actions{display:none;gap:2px;flex-shrink:0}
.member-item:hover .member-actions{display:flex}
.member-item:hover .member-task-count{display:none}
.m-act-btn{width:16px;height:16px;border-radius:3px;border:none;background:transparent;color:var(--dim);font-size:.6rem;display:flex;align-items:center;justify-content:center}
.m-act-btn:hover{color:var(--text)}
.m-act-btn.del:hover{color:var(--red)}

/* ── Main ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.main-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--dim);text-align:center;padding:24px}
.main-empty .ico{font-size:2rem;margin-bottom:8px}
.main-empty p{font-size:.75rem;line-height:1.6;max-width:220px}

/* Member header */
.member-header{padding:14px 18px 12px;border-bottom:1px solid var(--bd);flex-shrink:0;display:flex;align-items:center;gap:12px;transition:border-color .25s}
.mh-avatar{width:38px;height:38px;border-radius:50%;background:rgba(108,111,245,.15);border:1px solid rgba(108,111,245,.3);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:var(--accent);flex-shrink:0}
.mh-name{font-size:.95rem;font-weight:800;letter-spacing:-.01em}
.mh-sub{font-size:.68rem;color:var(--muted);margin-top:1px;transition:color .25s}
.mh-spacer{flex:1}
.mh-actions{display:flex;gap:6px;align-items:center}
.icon-btn{width:28px;height:28px;border-radius:5px;border:1px solid var(--bd);background:var(--card);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:.8rem;transition:all .15s}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn.danger:hover{border-color:var(--red);color:var(--red)}

/* Task area */
.task-area{flex:1;overflow-y:auto;padding:10px 14px 16px}

/* Filter row */
.filter-row{display:flex;align-items:center;gap:6px;padding:8px 14px;border-bottom:1px solid var(--bd);flex-shrink:0;transition:border-color .25s;flex-wrap:wrap}
.filter-label{font-size:.62rem;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.search-input{flex:1;min-width:100px;padding:4px 10px;border-radius:5px;border:1px solid var(--bd);background:var(--card);color:var(--text);font-size:.74rem;outline:none;transition:border-color .15s,background .25s}
.member-search-wrap{position:relative;min-width:130px;max-width:190px}
.member-search-input{width:100%;padding:4px 10px;border-radius:5px;border:1px solid var(--bd);background:var(--card);color:var(--text);font-size:.74rem;outline:none;transition:border-color .15s,background .25s}
.member-search-input:focus{border-color:var(--accent)}
.member-search-input::placeholder{color:var(--dim)}
.member-search-list{position:fixed;background:var(--surface);border:1px solid var(--bd);border-radius:7px;z-index:9000;max-height:220px;overflow-y:auto;box-shadow:0 6px 20px rgba(0,0,0,.35);display:none}
.member-search-item{padding:6px 12px;font-size:.78rem;cursor:pointer;white-space:nowrap;transition:background .1s}
.member-search-item:hover,.member-search-item.selected{background:rgba(108,111,245,.15);color:var(--accent)}
.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:var(--dim)}
.filter-divider{width:1px;height:16px;background:var(--bd);flex-shrink:0}
.filter-btn{font-size:.64rem;font-weight:600;padding:3px 9px;border-radius:4px;border:1px solid var(--bd);background:var(--card);color:var(--muted);transition:all .15s}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* ── Asset view ── */
.asset-view{flex:1;overflow-y:auto;padding:14px 18px}
.asset-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.asset-toolbar-title{font-size:.82rem;font-weight:800;flex:1}
.asset-filter-row{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.asset-search{flex:1;min-width:120px;padding:5px 10px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--text);font-size:.76rem;outline:none;transition:border-color .15s}
.asset-search:focus{border-color:var(--accent)}
.asset-search::placeholder{color:var(--dim)}
.asset-cat-select{padding:5px 8px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--text);font-size:.76rem;outline:none;transition:border-color .15s}
.asset-cat-select:focus{border-color:var(--accent)}
.asset-cat-select option{background:var(--card)}
.asset-table{width:100%;border-collapse:collapse;font-size:.78rem}
.asset-table th{text-align:left;font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--bd)}
.asset-table td{padding:8px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}
.asset-table tr:last-child td{border-bottom:none}
.asset-table tr:hover td{background:var(--card)}
.asset-cond{font-size:.6rem;font-weight:700;padding:2px 7px;border-radius:4px;border:1px solid transparent}
.asset-cond.baik{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.3);color:#34d399}
.asset-cond.ringan{background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.3);color:var(--gold)}
.asset-cond.berat{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.3);color:var(--red)}
.asset-act-btn{width:22px;height:22px;border-radius:4px;border:1px solid var(--bd);background:transparent;color:var(--dim);font-size:.7rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .15s}
.asset-act-btn:hover{border-color:var(--accent);color:var(--accent)}
.asset-act-btn.del:hover{border-color:var(--red);color:var(--red)}
.asset-empty{text-align:center;color:var(--dim);font-size:.78rem;padding:40px 0}

/* ── Org chart ── */
.org-view{flex:1;overflow:auto;padding:32px 24px}
.org-level-row{display:flex;gap:16px;justify-content:center;flex-shrink:0}
.org-root-node{background:var(--accent);color:#fff;border-radius:10px;padding:10px 24px;font-size:.9rem;font-weight:800;letter-spacing:-.01em;text-align:center;flex-shrink:0}
.org-level-row{display:flex;gap:16px;justify-content:center;flex-shrink:0}
.org-kelompok-node{background:var(--surface);border:2px solid var(--accent);border-radius:8px;padding:8px 14px;font-size:.74rem;font-weight:700;color:var(--accent);text-align:center;width:148px;flex-shrink:0;cursor:pointer;user-select:none;transition:background .15s,border-color .15s}
.org-kelompok-node.depth-1{background:var(--card);border:1.5px solid var(--bd);color:var(--muted)}
.org-kelompok-node:hover{background:rgba(108,111,245,.15);border-color:var(--accent);color:var(--accent)}
.org-k-name{font-size:.78rem;font-weight:700}
.org-k-meta{font-size:.6rem;color:var(--muted);margin-top:3px;font-family:var(--mono)}
/* modal anggota list */
.modal-member-list{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto}
.modal-member-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:7px;border:1px solid var(--bd);background:var(--card);cursor:pointer;transition:border-color .15s}
.modal-member-row:hover{border-color:var(--accent)}
.modal-member-av{width:28px;height:28px;border-radius:50%;background:rgba(108,111,245,.15);border:1px solid rgba(108,111,245,.3);display:flex;align-items:center;justify-content:center;font-size:.66rem;font-weight:700;color:var(--accent);flex-shrink:0}
.modal-member-info{flex:1;min-width:0}
.modal-member-name{font-size:.8rem;font-weight:600}
.modal-member-role{font-size:.62rem;color:var(--dim)}
.modal-member-tasks{font-size:.6rem;font-family:var(--mono);color:var(--dim);flex-shrink:0;display:flex;gap:6px;align-items:center}
/* sidebar indent */
.kelompok-children{padding-left:14px;border-left:1px solid var(--bd);margin-left:14px;margin-bottom:4px;transition:border-color .25s}
/* order btns */
.grp-order-btn{width:14px;height:14px;border-radius:2px;border:none;background:transparent;color:var(--dim);font-size:.55rem;display:flex;align-items:center;justify-content:center;line-height:1;padding:0}
.grp-order-btn:hover{color:var(--text)}
.task-add-btn-row{flex-shrink:0;padding:8px 14px;border-bottom:1px solid var(--bd);transition:border-color .25s}
.task-add-inline-btn{font-size:.72rem;font-weight:600;padding:5px 12px;border-radius:6px;border:1px dashed var(--bd);background:transparent;color:var(--muted);width:100%;text-align:left;transition:all .15s;display:flex;align-items:center;gap:6px}

/* ══════════════════════════════════════════
   PERSISTENCE
══════════════════════════════════════════ */
function gistOk(){ return !!GIST_ID && !!GIST_PAT; }

function migrate(d){
  d.kelompoks=d.kelompoks.map((k,i)=>Object.assign({parentId:null,order:i},k));
  if(!d.orgName) d.orgName='Alteco';
  if(!d.assets) d.assets=[];
  if(!d.events) d.events=[];
  if(!d.projects) d.projects=[];
  if(!d.cultures) d.cultures=[];
  if(!d.settings) d.settings={pushNotifEnabled:false,notifTime:'07:00',notifDaysBefore:1};
  if(!d.settings.notifTime) d.settings.notifTime='07:00';
  if(d.settings.notifDaysBefore==null) d.settings.notifDaysBefore=1;
  if(d.events) d.events=d.events.map(ev=>Object.assign({notifSentDate:null},ev));
  return d;
}

function localLoad(){
  try{
    const d=JSON.parse(localStorage.getItem(LS_KEY));
    if(d&&d.kelompoks&&d.members&&d.tasks) return migrate(d);
  }catch{}
  return {kelompoks:[],members:[],tasks:[],assets:[],orgName:'Alteco',events:[],settings:{pushNotifEnabled:false,notifTime:'07:00'}};
}

async function gistLoad(){
  const headers={'Accept':'application/vnd.github+json'};
  if(GIST_PAT) headers['Authorization']=`Bearer ${GIST_PAT}`;
  const r=await fetch(`https://api.github.com/gists/${GIST_ID}`,{headers});
  if(!r.ok) throw new Error('gist fetch '+r.status);
  const gist=await r.json();
  const content=gist.files[GIST_FILE]?.content;
  if(!content) return null;
  const d=JSON.parse(content);
  if(d&&d.kelompoks&&d.members&&d.tasks) return migrate(d);
  return null;
}

let _saveTimer=null;
function save(){
  localStorage.setItem(LS_KEY,JSON.stringify(db)); /* immediate local backup */
  if(!gistOk()) return;
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(async()=>{
    try{
      await fetch(`https://api.github.com/gists/${GIST_ID}`,{
        method:'PATCH',
        headers:{'Authorization':`Bearer ${GIST_PAT}`,'Content-Type':'application/json','Accept':'application/vnd.github+json'},
        body:JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify(db)}}})
      });
    }catch(e){ console.warn('Gist save failed',e); }
  },600);
}

/* ══════════════════════════════════════════
   GATE
══════════════════════════════════════════ */
(async function(){
  /* Load data: Gist first, fallback to localStorage */
  const overlay=document.getElementById('loadingOverlay');
  try{
    const remote=await gistLoad();
    db=remote||localLoad();
  }catch(e){
    console.warn('Gist load failed, using local',e);
    db=localLoad();
  }
  overlay.style.opacity='0';
  setTimeout(()=>overlay.style.display='none',300);

  /* Update gate org name */
  document.getElementById('gateOrg').textContent=db.orgName||'Alteco';

  const gate=document.getElementById('gate');
  const inp=document.getElementById('gateInput');
  const btn=document.getElementById('gateBtn');
  const err=document.getElementById('gateErr');

  /* Restore session */
  const stored=sessionStorage.getItem('rak_alteco_role');
  if(stored==='admin'||stored==='viewer'){
    role=stored;
    try{
      const up=localStorage.getItem('alteco_unlocked_projects');
      if(up) unlockedProjects=new Map(JSON.parse(up));
    }catch{}
    gate.classList.add('hidden'); applyRole(); return;
  }

  /* Password toggle — staff */
  document.getElementById('gatePwToggle').addEventListener('click',()=>{
    inp.type=inp.type==='password'?'text':'password';
  });

  /* Staff login */
  function attempt(){
    const val=inp.value.trim();
    if(val===PASS_ADMIN){
      role='admin'; sessionStorage.setItem('rak_alteco_role','admin');
      if(!GIST_PAT){
        const pat=(prompt('Masukkan GitHub PAT untuk sinkronisasi data:')||'').trim();
        if(pat){ GIST_PAT=pat; localStorage.setItem(GIST_PAT_KEY,pat); }
      }
      gate.classList.add('hidden'); applyRole();
    }
    else if(val===PASS_VIEW){
      role='viewer'; sessionStorage.setItem('rak_alteco_role','viewer');
      gate.classList.add('hidden'); applyRole();
    }
    else {
      inp.classList.add('error'); err.textContent='Kode akses tidak valid.'; inp.value='';
      setTimeout(()=>{inp.classList.remove('error');err.textContent=''},1500);
    }
  }
  btn.addEventListener('click',attempt);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')attempt()});

  inp.focus();
})();

/* ══════════════════════════════════════════
   HELPERS
══════════════════════════════════════════ */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6) }
function initials(n){ return n.trim().split(/\s+/).slice(0,2).map(w=>w[0].toUpperCase()).join('') }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
function memberTasks(mid){ return db.tasks.filter(t=>t.memberId===mid) }
function kelompokName(did){ const d=db.kelompoks.find(x=>x.id===did); return d?d.name:'' }
function kelompokAllIds(id){ const ch=db.kelompoks.filter(k=>k.parentId===id); return [id,...ch.flatMap(c=>kelompokAllIds(c.id))]; }
function recurrenceLabel(r){
  const map={harian:'Harian',mingguan:'Mingguan',bulanan:'Bulanan',tahunan:'Tahunan'};
  return map[r]||r||'';
}
function fmtDueDate(d){
  if(!d) return '';
  return new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
}

/* ══════════════════════════════════════════
   SIDEBAR RENDER
══════════════════════════════════════════ */
function kelompokChildren(parentId){
  return db.kelompoks
    .filter(k=>(k.parentId||null)===parentId)
    .sort((a,b)=>a.order-b.order);
}

function renderSidebar(){
  const allItem=document.getElementById('allItem');
  allItem.className='all-item'+(activeId===ALL?' active':'');
  document.getElementById('allCount').textContent=db.tasks.length||'';

  const scroll=document.getElementById('peopleScroll');
  scroll.innerHTML='';

  /* auto-expand kelompok of active member */
  if(activeId && activeId!==ALL){
    const activeMember=db.members.find(m=>m.id===activeId);
    if(activeMember?.kelompokId) expandedKelompoks.add(activeMember.kelompokId);
  }

  /* Recursive render */
  function renderKelompokGroup(parentId, container){
    kelompokChildren(parentId).forEach(k=>{
      const block=document.createElement('div');
      block.className='kelompok-block';

      const expanded=expandedKelompoks.has(k.id);
      const siblings=kelompokChildren(k.parentId||null);
      const idx=siblings.findIndex(s=>s.id===k.id);

      const memberCount=db.members.filter(m=>m.kelompokId===k.id).length;
      const hdr=document.createElement('div');
      hdr.className='kelompok-label';
      hdr.innerHTML=`
        ${memberCount?`<span class="kelompok-chevron" style="transform:rotate(${expanded?90:0}deg);cursor:pointer" data-toggle-grp="${k.id}">▶</span>`:''}
        <span class="kelompok-name-text">${esc(k.name)}</span>
        ${role==='admin'?`<span class="grp-actions">
          ${idx>0?`<button class="grp-order-btn" data-grp-up="${k.id}" title="Naik">▲</button>`:''}
          ${idx<siblings.length-1?`<button class="grp-order-btn" data-grp-dn="${k.id}" title="Turun">▼</button>`:''}
          <button class="grp-act-btn" data-grp-edit="${k.id}" title="Edit">✎</button>
          <button class="grp-act-btn del" data-grp-del="${k.id}" title="Hapus">✕</button>
          <button class="grp-act-btn" data-grp-add-mem="${k.id}" title="+ Anggota" style="color:var(--accent)">+</button>
        </span>`:''}
      `;

      /* collapsible members only */
      const membersBody=document.createElement('div');
      membersBody.className='kelompok-body';
      membersBody.style.display=expanded?'':'none';
      db.members.filter(m=>m.kelompokId===k.id).sort((a,b)=>a.name.localeCompare(b.name,'id')).forEach(m=>membersBody.appendChild(makeMemberItem(m)));

      /* toggle on chevron click */
      hdr.querySelector('[data-toggle-grp]')?.addEventListener('click',e=>{
        e.stopPropagation();
        if(expandedKelompoks.has(k.id)) expandedKelompoks.delete(k.id);
        else expandedKelompoks.add(k.id);
        renderSidebar();
      });

      /* child kelompoks always visible */
      const childList=kelompokChildren(k.id);
      if(childList.length){
        const childWrap=document.createElement('div');
        childWrap.className='kelompok-children';
        renderKelompokGroup(k.id, childWrap);
        block.appendChild(hdr);
        block.appendChild(membersBody);
        block.appendChild(childWrap);
        container.appendChild(block);
        return;
      }

      block.appendChild(hdr);
      block.appendChild(membersBody);
      container.appendChild(block);
    });
  }

  renderKelompokGroup(null, scroll);

  /* No-kelompok members */
  const noGrpMembers=db.members.filter(m=>!m.kelompokId||!db.kelompoks.find(d=>d.id===m.kelompokId));
  if(noGrpMembers.length){
    const NO_GRP='__no_grp__';
    const expandedNG=expandedKelompoks.has(NO_GRP);
    const block=document.createElement('div');
    block.className='kelompok-block';
    const hdr=document.createElement('div');
    hdr.className='kelompok-label';
    hdr.innerHTML=`<span class="kelompok-chevron" style="transform:rotate(${expandedNG?90:0}deg)">▶</span><span class="kelompok-name-text" style="color:var(--dim)">Tanpa Kelompok</span>`;
    const body=document.createElement('div');
    body.className='kelompok-body';
    body.style.display=expandedNG?'':'none';
    noGrpMembers.sort((a,b)=>a.name.localeCompare(b.name,'id')).forEach(m=>body.appendChild(makeMemberItem(m)));
    hdr.addEventListener('click',()=>{
      if(expandedKelompoks.has(NO_GRP)) expandedKelompoks.delete(NO_GRP);
      else expandedKelompoks.add(NO_GRP);
      renderSidebar();
    });
    block.appendChild(hdr);
    block.appendChild(body);
    scroll.appendChild(block);
  }

  /* Bind actions */
  scroll.querySelectorAll('[data-grp-up]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    const k=db.kelompoks.find(x=>x.id===b.dataset.grpUp);
    if(!k) return;
    const siblings=kelompokChildren(k.parentId||null);
    const i=siblings.findIndex(s=>s.id===k.id);
    if(i>0){ const tmp=siblings[i-1].order; siblings[i-1].order=k.order; k.order=tmp; }
    save(); renderSidebar();
  }));
  scroll.querySelectorAll('[data-grp-dn]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    const k=db.kelompoks.find(x=>x.id===b.dataset.grpDn);
    if(!k) return;
    const siblings=kelompokChildren(k.parentId||null);
    const i=siblings.findIndex(s=>s.id===k.id);
    if(i<siblings.length-1){ const tmp=siblings[i+1].order; siblings[i+1].order=k.order; k.order=tmp; }
    save(); renderSidebar();
  }));
  scroll.querySelectorAll('[data-grp-edit]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    openModal('grp-edit',{id:b.dataset.grpEdit});
  }));
  scroll.querySelectorAll('[data-grp-del]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    const k=db.kelompoks.find(d=>d.id===b.dataset.grpDel);
    if(!k) return;
    const allIds=kelompokAllIds(k.id);
    const memberIds=db.members.filter(m=>allIds.includes(m.kelompokId)).map(m=>m.id);
    const subCount=allIds.length-1;
    if(!confirm(`Hapus kelompok "${k.name}"? ${subCount?`${subCount} sub-kelompok dan `:''} ${memberIds.length} anggota beserta tugasnya ikut terhapus.`)) return;
    db.tasks=db.tasks.filter(t=>!memberIds.includes(t.memberId));
    db.members=db.members.filter(m=>!allIds.includes(m.kelompokId));
    db.kelompoks=db.kelompoks.filter(d=>!allIds.includes(d.id));
    if(memberIds.includes(activeId)) activeId=null;
    save(); renderSidebar(); if(viewMode==='org') renderOrgChart(); else renderMain();
  }));
  scroll.querySelectorAll('[data-grp-add-mem]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    openModal('mem-add',{kelompokId:b.dataset.grpAddMem});
  }));
}

function makeMemberItem(m){
  const count=memberTasks(m.id).length;
  const div=document.createElement('div');
  div.className='member-item'+(activeId===m.id?' active':'');
  div.innerHTML=`
    <div class="member-avatar">${initials(m.name)}</div>
    <div class="member-info">
      <div class="member-name">${esc(m.name)}</div>
      ${m.role?`<div class="member-role">${esc(m.role)}</div>`:''}
    </div>
    <span class="member-task-count">${count||''}</span>
    ${role==='admin'?`<span class="member-actions">
      <button class="m-act-btn" data-mem-edit="${m.id}">✎</button>
      <button class="m-act-btn del" data-mem-del="${m.id}">✕</button>
    </span>`:''}
  `;
  div.addEventListener('click',e=>{
    if(e.target.closest('.member-actions')) return;
    select(m.id);
  });
  if(role==='admin'){
    div.querySelector(`[data-mem-edit="${m.id}"]`).addEventListener('click',e=>{
      e.stopPropagation();
      openModal('mem-edit',{id:m.id});
    });
    div.querySelector(`[data-mem-del="${m.id}"]`).addEventListener('click',e=>{
      e.stopPropagation();
      if(!confirm(`Hapus "${m.name}" dan semua tugasnya?`)) return;
      db.members=db.members.filter(x=>x.id!==m.id);
      db.tasks=db.tasks.filter(t=>t.memberId!==m.id);
      if(activeId===m.id) activeId=null;
      save(); renderSidebar(); if(viewMode==='org') renderOrgChart(); else renderMain();
    });
  }
  return div;
}

      taskAddRow.style.display='flex';
    } else {
      taskAddRow.style.display='none';
    }
  }

  renderTasks();
}

/* ══════════════════════════════════════════
   TASKS RENDER
══════════════════════════════════════════ */
function renderTasks(){
  const area=document.getElementById('taskArea');
  area.innerHTML='';
  const isAll=activeId===ALL;

  function applyFilter(arr){
    if(activeFilter==='recurring') return arr.filter(t=>t.type==='recurring');
    if(activeFilter==='once') return arr.filter(t=>t.type==='once');
    return arr;
  }

  if(isAll){
    /* build name-groups: distinct name → array of member objects, sorted alpha */
    const nameMap=new Map();
    db.members.forEach(m=>{
      if(!nameMap.has(m.name)) nameMap.set(m.name,[]);
      nameMap.get(m.name).push(m);
    });
    let groups=[...nameMap.entries()]
      .sort((a,b)=>a[0].localeCompare(b[0],'id'))
      .map(([name,members])=>({name,members}));
    if(filterMemberName) groups=groups.filter(g=>g.name===filterMemberName);
    else if(memberSearchQuery) groups=groups.filter(g=>g.name.toLowerCase().includes(memberSearchQuery));

    groups.forEach(({name,members})=>{
      /* format: KelompokA (jabatan), KelompokB */
      const kelompokLabel=members.map(m=>{
        const kn=kelompokName(m.kelompokId);
        if(!kn) return m.role?`(${esc(m.role)})`:null;
        return m.role?`${esc(kn)} (${esc(m.role)})`:esc(kn);
      }).filter(Boolean).join(', ');

      if(filterMemberName){
        /* filtered by name: sub-section per kelompok */
        const totalFiltered=members.reduce((s,m)=>s+applyFilter(memberTasks(m.id)).length,0);
        const gh=document.createElement('div');
        gh.className='group-header';
        gh.innerHTML=`
          <div class="group-avatar">${initials(name)}</div>
          <span class="group-name">${esc(name)}</span>
          ${kelompokLabel?`<span class="group-role" style="color:var(--dim)">${kelompokLabel}</span>`:''}
          <span class="group-count">${totalFiltered} tugas</span>
        `;
        area.appendChild(gh);

        members.forEach(m=>{

          sh.className='task-section-header';
          sh.innerHTML=`<span class="task-section-ico">🏢</span><span class="task-section-label">${esc(kName)}</span><span class="task-section-count">${tasks.length}</span>`;

            emp.textContent=activeFilter==='recurring'?'Tidak ada tugas berulang.':activeFilter==='once'?'Tidak ada tugas sekali.':'Belum ada tugas.';
            area.appendChild(emp);
          } else {
            tasks.forEach(t=>area.appendChild(makeTaskCard(t,false)));
          }
        });
      } else {
        /* not filtered: header only, clickable → filter by name */
        const totalTasks=members.reduce((s,m)=>s+memberTasks(m.id).length,0);
        const gh=document.createElement('div');
        gh.className='group-header';
        gh.style.cssText='cursor:pointer;transition:background .15s';
        gh.innerHTML=`
          <div class="group-avatar">${initials(name)}</div>
          <span class="group-name">${esc(name)}</span>
          ${kelompokLabel?`<span class="group-role" style="color:var(--dim)">${kelompokLabel}</span>`:''}
          <span style="flex:1"></span>

    if(!groups.length){
      area.innerHTML=`<div style="padding:32px;text-align:center;color:var(--dim);font-size:.78rem">Belum ada anggota.</div>`;
    }
  } else {
    const allTasks=memberTasks(activeId);
    const recurring=applyFilter(allTasks.filter(t=>t.type==='recurring'));
    const once=applyFilter(allTasks.filter(t=>t.type==='once'));

    /* Section: Berulang */
    if(activeFilter!=='once'){
      const sh=document.createElement('div');
      sh.className='task-section-header';
      sh.innerHTML=`<span class="task-section-ico">🔁</span><span class="task-section-label">Berulang</span><span class="task-section-count">${recurring.length}</span>`;
      area.appendChild(sh);
      if(!recurring.length){
        const e=document.createElement('div');
        e.style.cssText='font-size:.72rem;color:var(--dim);padding:8px 2px 12px';
        e.textContent='Belum ada tugas berulang.';
        area.appendChild(e);
      } else {
        recurring.forEach(t=>area.appendChild(makeTaskCard(t,true)));
      }
    }

    /* Section: Sekali */
    if(activeFilter!=='recurring'){
      const sh=document.createElement('div');
      sh.className='task-section-header';
      sh.style.marginTop='10px';
      sh.innerHTML=`<span class="task-section-ico">📌</span><span class="task-section-label">Sekali</span><span class="task-section-count">${once.length}</span>`;
      area.appendChild(sh);
      if(!once.length){
        const e=document.createElement('div');
        e.style.cssText='font-size:.72rem;color:var(--dim);padding:8px 2px 12px';
        e.textContent='Belum ada tugas sekali.';
        area.appendChild(e);
      } else {
        once.forEach(t=>area.appendChild(makeTaskCard(t,true)));
      }
    }
  }
}

function makeTaskCard(t, showActions){
  const div=document.createElement('div');
  div.className='task-card';
  const isRecurring=t.type==='recurring';
  div.innerHTML=`
    <div class="task-left-bar ${isRecurring?'task-recurring-bar':'task-once-bar'}"></div>
    <div class="task-body">
      <div class="task-title">${esc(t.title)}</div>
      <div class="task-badges">
        <span class="task-type-badge ${isRecurring?'badge-recurring':'badge-once'}">${isRecurring?'🔁 Berulang':'📌 Sekali'}</span>
        ${isRecurring&&t.recurrence?`<span class="task-recur-detail">${esc(recurrenceLabel(t.recurrence))}</span>`:''}
        ${!isRecurring&&t.dueDate?`<span class="task-recur-detail">📅 ${esc(fmtDueDate(t.dueDate))}</span>`:''}
      </div>
      ${t.notes?`<div class="task-notes">${esc(t.notes)}</div>`:''}
    </div>
    ${showActions&&role==='admin'?`<div class="task-card-actions">
      <button class="tc-act" title="Edit" data-task-edit="${t.id}">✎</button>
      <button class="tc-act del" title="Hapus" data-task-del="${t.id}">✕</button>
    </div>`:''}
  `;
  if(showActions&&role==='admin'){
    div.querySelector(`[data-task-edit="${t.id}"]`).addEventListener('click',()=>openModal('task-edit',{id:t.id}));
    div.querySelector(`[data-task-del="${t.id}"]`).addEventListener('click',()=>{
      if(!confirm('Hapus tugas ini?')) return;
      db.tasks=db.tasks.filter(x=>x.id!==t.id);
      save(); renderSidebar(); renderTasks();
    });
  }
  return div;
}

function renderAssetTable(){
  const wrap=document.getElementById('assetTableWrap');
  if(!wrap) return;
  wrap.innerHTML='';

  /* update category options */
  const catSel=document.getElementById('assetCatSel');
  if(catSel){
    const cats=[...new Set(db.assets.map(a=>a.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'id'));
    catSel.innerHTML=`<option value="">Semua Kategori</option>`+cats.map(c=>`<option value="${esc(c)}"${assetCatFilter===c?' selected':''}>${esc(c)}</option>`).join('');
  }

  /* filter */
  let assets=[...db.assets].sort((a,b)=>a.name.localeCompare(b.name,'id'));
  if(assetSearch) assets=assets.filter(a=>a.name.toLowerCase().includes(assetSearch));
  if(assetCatFilter) assets=assets.filter(a=>a.category===assetCatFilter);

  if(!assets.length){
    const emp=document.createElement('div');
    emp.className='asset-empty';
    emp.textContent=db.assets.length?'Tidak ada aset yang cocok.':'Belum ada aset.';
    wrap.appendChild(emp);
    return;
  }

  const table=document.createElement('table');
  table.className='asset-table';
  table.innerHTML=`<thead><tr>
    <th>#</th><th>Nama Aset</th><th>Kategori</th><th>Jml</th><th>Satuan</th><th>URL</th><th>Tgl Pengadaan</th><th>Keterangan</th>
    ${role==='admin'?'<th></th>':''}
  </tr></thead>`;
  const tbody=document.createElement('tbody');
  assets.forEach((a,i)=>{
    const tgl=a.acquiredAt?new Date(a.acquiredAt).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}):'—';
    const urlCell=a.url?`<a href="${esc(a.url)}" target="_blank" rel="noopener" style="color:var(--accent);font-size:.72rem;white-space:nowrap;max-width:160px;display:inline-block;overflow:hidden;text-overflow:ellipsis;vertical-align:middle" title="${esc(a.url)}">${esc(a.url)}</a><button data-copy-url="${esc(a.url)}" style="margin-left:4px;background:none;border:none;cursor:pointer;color:var(--dim);font-size:.7rem;padding:0 2px;vertical-align:middle" title="Salin URL">⧉</button>`:'—';
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td style="color:var(--dim);font-size:.68rem">${i+1}</td>
      <td style="font-weight:600">${esc(a.name)}</td>
      <td>${esc(a.category||'—')}</td>
      <td style="font-family:var(--mono)">${a.qty??'—'}</td>
      <td>${esc(a.unit||'—')}</td>
      <td style="max-width:180px">${urlCell}</td>
      <td style="font-size:.72rem;white-space:nowrap">${tgl}</td>
      <td style="color:var(--muted);font-size:.72rem">${esc(a.notes||'—')}</td>
      ${role==='admin'?`<td style="white-space:nowrap">
        <button class="asset-act-btn" data-asset-edit="${a.id}" title="Edit">✎</button>
        <button class="asset-act-btn del" data-asset-del="${a.id}" title="Hapus">✕</button>
      </td>`:''}
    `;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);

  wrap.querySelectorAll('[data-asset-edit]').forEach(b=>b.addEventListener('click',()=>openModal('asset-edit',{id:b.dataset.assetEdit})));
  wrap.querySelectorAll('[data-asset-del]').forEach(b=>b.addEventListener('click',()=>{
    const a=db.assets.find(x=>x.id===b.dataset.assetDel);
    if(!a||!confirm(`Hapus aset "${a.name}"?`)) return;
    db.assets=db.assets.filter(x=>x.id!==a.id);
    save(); renderAssetTable();
  }));
  wrap.querySelectorAll('[data-copy-url]').forEach(b=>b.addEventListener('click',()=>{
    navigator.clipboard.writeText(b.dataset.copyUrl).then(()=>{
      const orig=b.textContent; b.textContent='✓'; setTimeout(()=>b.textContent=orig,1200);
    });
  }));
}

/* ══════════════════════════════════════════
   ORG CHART RENDER
══════════════════════════════════════════ */
function renderOrgChart(){
  const area=document.getElementById('orgArea');
  area.innerHTML='';

  if(!db.kelompoks.length){
    area.innerHTML=`<div style="text-align:center;color:var(--dim);font-size:.78rem;padding:40px">Belum ada kelompok.</div>`;
    return;
  }

  const NW=148,NH=54,RH=40,HG=24,VG=56,PAD=24;

  /* subtree width = max(node width, sum of children subtrees + gaps) */
  function sw(id){
    const kids=kelompokChildren(id);
    if(!kids.length) return NW;
    const total=kids.reduce((s,k)=>s+sw(k.id),0)+(kids.length-1)*HG;
    return Math.max(NW,total);
  }

  /* assign absolute X center per node */
  const posX={};
  function assignX(kids,startX){
    let cur=startX;
    kids.forEach(k=>{
      const s=sw(k.id);
      posX[k.id]=cur+s/2;
      assignX(kelompokChildren(k.id),cur);
      cur+=s+HG;
    });
  }
  const topKids=kelompokChildren(null);
  const totalW=topKids.reduce((s,k)=>s+sw(k.id),0)+(topKids.length-1)*HG;
  assignX(topKids,PAD);

  /* depth per node */
  function nodeDepth(id){ const k=db.kelompoks.find(x=>x.id===id); return(!k||!k.parentId)?0:1+nodeDepth(k.parentId); }
  function maxD(id,d){ const kids=kelompokChildren(id); return kids.length?Math.max(...kids.map(c=>maxD(c.id,d+1))):d; }
  const maxDepth=topKids.length?Math.max(...topKids.map(k=>maxD(k.id,0))):0;

  const canvasW=totalW+PAD*2;
  const canvasH=PAD+RH+VG+(maxDepth+1)*(NH+VG)+PAD;

  const canvas=document.createElement('div');
  canvas.style.cssText=`position:relative;width:${canvasW}px;height:${canvasH}px;margin:0 auto`;

  /* Root node */
  const rootEl=document.createElement('div');
  rootEl.className='org-root-node';
  rootEl.textContent=db.orgName||'Alteco';
  rootEl.style.cssText=`position:absolute;top:${PAD}px;left:50%;transform:translateX(-50%)`;
  canvas.appendChild(rootEl);

  /* Kelompok nodes — absolutely positioned */
  db.kelompoks.forEach(k=>{
    if(posX[k.id]===undefined) return;
    const d=nodeDepth(k.id);
    const y=PAD+RH+VG+d*(NH+VG);
    const mc=db.members.filter(m=>m.kelompokId===k.id).length;
    const tc=db.tasks.filter(t=>db.members.some(m=>m.id===t.memberId&&m.kelompokId===k.id)).length;
    const el=document.createElement('div');
    el.className='org-kelompok-node'+(k.parentId?' depth-1':'');
    el.dataset.kid=k.id;
    el.style.cssText=`position:absolute;left:${posX[k.id]-NW/2}px;top:${y}px;width:${NW}px`;
    el.innerHTML=`<div class="org-k-name">${esc(k.name)}</div><div class="org-k-meta">${mc} anggota${tc?` · ${tc} tugas`:''}</div>`;
    el.addEventListener('click',()=>openModal('kelompok-members',{kelompokId:k.id}));
    canvas.appendChild(el);
  });

  area.appendChild(canvas);

  /* SVG connector lines after DOM is painted */
  requestAnimationFrame(()=>{
    const bdColor=getComputedStyle(document.documentElement).getPropertyValue('--bd').trim()||'#888';
    const cr=canvas.getBoundingClientRect();
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible';

    function getEl(id){ return canvas.querySelector(`[data-kid="${id}"]`); }
    function cxEl(el){ const r=el.getBoundingClientRect(); return Math.round(r.left+r.width/2-cr.left); }
    function botEl(el){ return Math.round(el.getBoundingClientRect().bottom-cr.top); }
    function topEl(el){ return Math.round(el.getBoundingClientRect().top-cr.top); }

    function seg(x1,y1,x2,y2){
      const l=document.createElementNS('http://www.w3.org/2000/svg','line');
      l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);
      l.setAttribute('stroke',bdColor);l.setAttribute('stroke-width','1.5');l.setAttribute('stroke-linecap','round');
      svg.appendChild(l);
    }

    function branch(pCX,pBot,childEls){
      if(!childEls.length) return;
      const cTop=topEl(childEls[0]);
      const midY=Math.round((pBot+cTop)/2);
      seg(pCX,pBot,pCX,midY);
      const xs=childEls.map(cxEl);
      if(childEls.length===1){
        seg(xs[0],midY,xs[0],cTop);
      } else {
        seg(xs[0],midY,xs[xs.length-1],midY);
        xs.forEach((x,i)=>seg(x,midY,x,topEl(childEls[i])));
      }
    }

    /* root → top-level */
    const rootRect=rootEl.getBoundingClientRect();
    const rCX=Math.round(rootRect.left+rootRect.width/2-cr.left);
    const rBot=Math.round(rootRect.bottom-cr.top);
    branch(rCX,rBot,topKids.map(k=>getEl(k.id)).filter(Boolean));

    /* each kelompok → its children */
    db.kelompoks.forEach(k=>{
      const el=getEl(k.id);
      if(!el) return;
      const childEls=kelompokChildren(k.id).map(c=>getEl(c.id)).filter(Boolean);
      if(childEls.length) branch(cxEl(el),botEl(el),childEls);
    });

    canvas.insertBefore(svg,canvas.firstChild);
  });
}

    function addKelompokRow(container){

      row.innerHTML=`
        <div class="repeater-fields">

document.getElementById('modalSave').addEventListener('click',()=>{

      id:uid(), title:title2,
      desc:document.getElementById('fi-edesc').value.trim(),

      notifSentDate:null,
      createdAt:Date.now()
    });
    save(); renderInfo(); updateBellBadge(); closeModal(); return;
  }

  if(mMode==='event-edit'){
    const ev=db.events.find(x=>x.id===mCtx.id);
    if(!ev) return;
    const title2=document.getElementById('fi-etitle').value.trim();
    if(!title2) return;
    const etype=mCtx._getEType();
    const erecur=etype==='recurring'?mCtx._getERecur():null;
    const recurDateEl=document.getElementById('fi-erecurdate');
    ev.title=title2;
    ev.desc=document.getElementById('fi-edesc').value.trim();
    ev.type=etype;
    ev.date=etype==='once'?(document.getElementById('fi-edate').value||null):null;
    ev.recurrence=erecur;
    ev.recurDate=erecur&&erecur!=='harian'?(recurDateEl?.value||null):null;
    ev.notifSentDate=null; /* reset — trigger notif again */
    ev.updatedAt=Date.now();
    save(); renderInfo(); updateBellBadge(); closeModal(); return;
  }

  if(mMode==='div-add'){
    const rows=[...document.querySelectorAll('#rptr .repeater-row')];
    let added=0;
    rows.forEach(row=>{
      const name=row.querySelector('input').value.trim();
      if(!name) return;
      const parentId=row.querySelector('select').value||null;
      const siblings=kelompokChildren(parentId);
      const order=siblings.length?Math.max(...siblings.map(s=>s.order))+1:0;
      db.kelompoks.push({id:uid(),name,parentId,order});
      added++;
    });
    if(!added) return;
    save(); renderSidebar(); if(viewMode==='org') renderOrgChart(); closeModal();
  }
  else if(mMode==='grp-edit'){
    const name=document.getElementById('fi-name').value.trim();
    if(!name) return;
    const parentId=document.getElementById('fi-parent').value||null;
    const k=db.kelompoks.find(d=>d.id===mCtx.id);
    if(k){
      if(k.parentId!==parentId){
        /* moved to different parent — reset order to last */
        const siblings=kelompokChildren(parentId).filter(s=>s.id!==k.id);
        k.order=siblings.length?Math.max(...siblings.map(s=>s.order))+1:0;
      }
      k.name=name; k.parentId=parentId;
      save(); renderSidebar(); if(viewMode==='org') renderOrgChart();
    }

  }
  else if(mMode==='mem-add'){

    rows.forEach(row=>{
      const inputs=row.querySelectorAll('input');
      const name=inputs[0].value.trim();
      if(!name) return;

      db.members.push(m);
      lastMember=m;
    });

    save(); renderSidebar(); closeModal();
    if(viewMode==='org') renderOrgChart(); else select(lastMember.id);
  }
  else if(mMode==='mem-edit'){
    const name=document.getElementById('fi-name').value.trim();
    if(!name) return;
    const role_v=document.getElementById('fi-role').value.trim();
    const kelompokId=document.getElementById('fi-div').value||null;

    }
  }
  else if(mMode==='task-add'||mMode==='task-edit'){
    const title=document.getElementById('fi-title').value.trim();
    if(!title) return;
    const type=mCtx._getType();
    const recurrence=type==='recurring'?mCtx._getRecur():'';
    const dueDate=type==='once'?mCtx._getDueDate():'';
    const notes=document.getElementById('fi-notes').value.trim();
    if(mMode==='task-add'){
      db.tasks.push({id:uid(),memberId:mCtx.memberId,title,type,recurrence,dueDate,notes,createdAt:Date.now()});
    } else {
      const t=db.tasks.find(x=>x.id===mCtx.id);
      if(t){t.title=title;t.type=type;t.recurrence=recurrence;t.dueDate=dueDate;t.notes=notes;}
    }
    save(); renderSidebar(); renderTasks(); closeModal();
  }

  /* ── Project modals ── */
  else if(mMode==='proj-add'||mMode==='proj-edit'){
    const title=document.getElementById('fi-ptitle').value.trim();
    const clientName=document.getElementById('fi-pclient').value.trim();
    const clientCode=document.getElementById('fi-pcode').value.trim();

    if(mMode==='proj-add'){
      db.projects.push({
        id:uid(), title, clientName, clientCode,
        description:document.getElementById('fi-pdesc').value.trim(),
        startDate:document.getElementById('fi-pstart').value||null,
        members:[], createdAt:Date.now()
      });
    } else {
      const p=db.projects.find(x=>x.id===mCtx.id);
      if(!p) return;
      p.title=title; p.clientName=clientName; p.clientCode=clientCode;
      p.description=document.getElementById('fi-pdesc').value.trim();
      p.startDate=document.getElementById('fi-pstart').value||null;
    }
    save(); renderProject(); closeModal();
  }

  else if(mMode==='proj-mem-add'||mMode==='proj-mem-edit'){
    const proj=db.projects.find(x=>x.id===mCtx.projId);
    if(!proj) return;
    const memType=mCtx._getMemberType();

function renderInfo(){
  const area = document.getElementById('infoArea');
  area.innerHTML = '';
  const today = new Date().toISOString().slice(0,10);

  // Toolbar
  const toolbar = document.createElement('div');
  toolbar.className = 'asset-toolbar';
  toolbar.innerHTML = `<span class="asset-toolbar-title">Pemberitahuan</span>`;
  if(role === 'admin'){
    const btn = document.createElement('button');
    btn.className = 'task-add-inline-btn';
    btn.textContent = '＋ Tambah Pemberitahuan';
    btn.addEventListener('click', ()=>openModal('event-add', {}));
    toolbar.appendChild(btn);
  }
  area.appendChild(toolbar);

  // Search bar
  const searchWrap = document.createElement('div');
  searchWrap.style.cssText = 'padding:8px 16px 4px';
  searchWrap.innerHTML = `<input type="search" id="infoSearchInp" placeholder="Cari judul pemberitahuan..." value="${esc(infoSearch)}" style="width:100%;padding:6px 10px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--text);font-size:.82rem;outline:none"/>`;
  area.appendChild(searchWrap);
  area.querySelector('#infoSearchInp').addEventListener('input', e=>{
    infoSearch = e.target.value;
    renderInfoList(area, today);
  });

  renderInfoList(area, today);
}

function renderInfoList(area, today){
  // Remove old list sections
  area.querySelectorAll('.info-section').forEach(el=>el.remove());

  const q = infoSearch.toLowerCase();
  const all = (db.events||[]).filter(ev=> !q || ev.title.toLowerCase().includes(q));

  // Split: lampau = once && date < today; aktif = rest
  const aktif = all.filter(ev=> ev.type==='recurring' || !ev.date || ev.date >= today)
    .sort((a,b)=>{
      const da = a.date||'9999', db2 = b.date||'9999';
      return da.localeCompare(db2);
    });
  const lampau = all.filter(ev=> ev.type==='once' && ev.date && ev.date < today)
    .sort((a,b)=> a.date.localeCompare(b.date)); // ascending by date

  if(!all.length){
    const e = document.createElement('div');
    e.className = 'asset-empty info-section';
    e.textContent = infoSearch ? 'Tidak ditemukan.' : 'Belum ada pemberitahuan.';
    area.appendChild(e);
    return;
  }

  function buildCard(ev){
    const card = document.createElement('div');
    card.className = 'info-event-card';

    let badgeClass = 'info-recur', badgeText = '🔁 Berulang';
    let metaDate = '';
    if(ev.type === 'once'){
      if(!ev.date){ badgeClass='info-recur'; badgeText='—'; }
      else if(ev.date === today){ badgeClass='info-today'; badgeText='📌 Hari ini'; }
      else if(ev.date > today){
        const diff = Math.round((new Date(ev.date)-new Date(today))/86400000);
        badgeClass='info-soon'; badgeText=`📅 ${diff} hari lagi`;
      } else { badgeClass='info-past'; badgeText='✓ Selesai'; }
      if(ev.date) metaDate = new Date(ev.date+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'});
    } else {
      badgeText = `🔁 ${recurrenceLabel(ev.recurrence||'mingguan')}`;
    }

    card.innerHTML = `
      <div class="info-event-title">${esc(ev.title)}</div>
      <div class="info-event-meta">
        <span class="info-event-badge ${badgeClass}">${badgeText}</span>
        ${metaDate?`<span>${metaDate}</span>`:''}
        ${ev.desc?`<span style="color:var(--muted)">${esc(ev.desc)}</span>`:''}
      </div>
    `;
    if(role === 'admin'){
      const actions = document.createElement('div');
      actions.style.cssText = 'display:flex;gap:6px;margin-top:8px';
      actions.innerHTML = `
        <button class="asset-act-btn" data-ev-edit="${ev.id}">✎</button>
        <button class="asset-act-btn del" data-ev-del="${ev.id}">✕</button>
      `;
      card.appendChild(actions);
    }
    return card;
  }

  function buildSection(label, items){
    if(!items.length) return;
    const sec = document.createElement('div');
    sec.className = 'info-section';
    const hdr = document.createElement('div');
    hdr.style.cssText = 'padding:10px 16px 4px;font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em';
    hdr.textContent = label;
    sec.appendChild(hdr);
    items.forEach(ev=> sec.appendChild(buildCard(ev)));
    area.appendChild(sec);
  }

  buildSection('Aktif / Akan Datang', aktif);
  buildSection('Lampau', lampau);

  area.querySelectorAll('[data-ev-edit]').forEach(b=>b.addEventListener('click',()=>openModal('event-edit',{id:b.dataset.evEdit})));
  area.querySelectorAll('[data-ev-del]').forEach(b=>b.addEventListener('click',()=>{
    const ev = db.events.find(x=>x.id===b.dataset.evDel);
    if(!ev||!confirm(`Hapus pemberitahuan "${ev.title}"?`)) return;
    db.events = db.events.filter(x=>x.id!==ev.id);
    save(); renderInfo();
  }));
}

   PROJECT VIEW

function fmtDate(d){ return d?new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}):''; }

function computeProjectDates(proj){
  const allOpt=(proj.members||[]).flatMap(m=>(m.tasks||[]).filter(t=>t.dueDate).map(t=>t.dueDate));
  const allPess=(proj.members||[]).flatMap(m=>(m.tasks||[]).map(t=>t.datePessimistic||t.dueDate).filter(Boolean));
  if(!allOpt.length&&!allPess.length) return {optimistic:null,pessimistic:null};
  const pessimistic=allPess.length?allPess.reduce((a,b)=>a>b?a:b):null;
  const perMember=(proj.members||[]).map(m=>{
    const dues=(m.tasks||[]).filter(t=>t.dueDate).map(t=>t.dueDate);
    return dues.length?dues.reduce((a,b)=>a>b?a:b):null;
  }).filter(Boolean);
  const optimistic=perMember.length?perMember.reduce((a,b)=>a<b?a:b):(pessimistic||null);
  return {optimistic,pessimistic:pessimistic||optimistic};
}

function projectStatus(proj){
  const today=new Date().toISOString().slice(0,10);
  const {pessimistic}=computeProjectDates(proj);
  if(!pessimistic) return 'active';
  if(today>pessimistic) return 'late';
  return 'active';
}

function projectProgress(proj){
  const tasks=(proj.members||[]).flatMap(m=>m.tasks||[]);
  if(!tasks.length) return 0;
  return Math.round(tasks.filter(t=>t.done).length/tasks.length*100);
}

function timelinePercent(projStart,projEnd,date){
  if(!projStart||!projEnd||!date) return 0;
  const s=new Date(projStart).getTime(), e=new Date(projEnd).getTime(), d=new Date(date).getTime();
  if(e<=s) return 100;
  return Math.min(100,Math.max(0,Math.round((d-s)/(e-s)*100)));
}

function buildMemberRow(proj, mem, pEnd, canEditTask, canEditMember){
  const memRow=document.createElement('div');
  memRow.className='proj-member-row';
  const memTasks=mem.tasks||[];
  const memDone=memTasks.filter(t=>t.done).length;

  const taskStarts=memTasks.filter(t=>t.startDate).map(t=>t.startDate);
  const taskEnds=memTasks.map(t=>t.datePessimistic||t.dueDate).filter(Boolean);
  const mStart=taskStarts.length?taskStarts.reduce((a,b)=>a<b?a:b):proj.startDate;
  const mEnd=taskEnds.length?taskEnds.reduce((a,b)=>a>b?a:b):pEnd;
  const mLeft=timelinePercent(proj.startDate,pEnd,mStart);
  const mWidth=Math.max(2,timelinePercent(proj.startDate,pEnd,mEnd)-mLeft);

  memRow.innerHTML=`
    <div class="proj-member-head">
      <div class="proj-member-avatar">${initials(mem.name)}</div>
      <div style="flex:1">
        <div class="proj-member-name">${esc(mem.name)}</div>
        <div class="proj-member-role">${esc(mem.role||'')}${mem.type==='external'?' · Eksternal':''}</div>
      </div>
      <div style="font-size:.62rem;color:var(--dim)">${memDone}/${memTasks.length} tugas</div>
      ${canEditMember?`<div style="display:flex;gap:4px;margin-left:8px">
        <button class="asset-act-btn" data-mem-edit="${mem.id}" data-proj="${proj.id}">✎</button>
        <button class="asset-act-btn del" data-mem-del="${mem.id}" data-proj="${proj.id}">✕</button>
      </div>`:''}
    </div>
    ${proj.startDate&&pEnd?`<div class="proj-member-tl">
      <div class="proj-member-tl-bar" style="left:${mLeft}%;width:${Math.max(4,mWidth)}%"></div>
    </div>`:''}
    <div class="proj-task-list" id="tasklist-${proj.id}-${mem.id}"></div>
    ${canEditTask?`<button class="proj-add-btn" data-task-add="${mem.id}" data-proj="${proj.id}">＋ Tambah tugas</button>`:''}
  `;

  const taskList=memRow.querySelector(`#tasklist-${proj.id}-${mem.id}`);
  memTasks.forEach(task=>{
    const ti=document.createElement('div');
    ti.className='proj-task-item'+(task.done?' done':'');
    ti.innerHTML=`
      <div class="proj-task-cb${task.done?' checked':''}" data-task-toggle="${task.id}" data-proj="${proj.id}" data-mem="${mem.id}">${task.done?'✓':''}</div>
      <span class="proj-task-text">${esc(task.text)}</span>
      <span class="proj-task-due">${task.startDate?fmtDate(task.startDate)+' → ':''}${task.dueDate?`<span style="color:var(--green,#34d399)">${fmtDate(task.dueDate)}</span>`:''}${task.datePessimistic?` <span style="color:var(--red,#f87171)">→ ${fmtDate(task.datePessimistic)}</span>`:''}</span>
      ${canEditTask?`<div class="proj-task-acts">
        <button class="asset-act-btn" style="font-size:.58rem;padding:2px 5px" data-task-edit="${task.id}" data-proj="${proj.id}" data-mem="${mem.id}">✎</button>
        <button class="asset-act-btn del" style="font-size:.58rem;padding:2px 5px" data-task-del="${task.id}" data-proj="${proj.id}" data-mem="${mem.id}">✕</button>
      </div>`:''}
    `;
    taskList.appendChild(ti);
  });
  return memRow;
}

function renderProject(){
  const area=document.getElementById('projectArea');
  area.innerHTML='';

  const toolbar=document.createElement('div');
  toolbar.className='asset-toolbar';
  toolbar.style.flexWrap='wrap';
  toolbar.innerHTML=`<span class="asset-toolbar-title">Proyek</span>
    <input id="projSearchInp" type="search" placeholder="Cari proyek…" value="${esc(projectSearch)}"
      style="flex:1;min-width:120px;max-width:240px;padding:5px 10px;border-radius:6px;border:1px solid var(--bd);background:var(--surface);color:var(--text);font-size:.78rem;outline:none"/>`;
  if(role==='admin'){
    const btn=document.createElement('button');
    btn.className='task-add-inline-btn';
    btn.textContent='＋ Tambah Proyek';
    btn.addEventListener('click',()=>openModal('proj-add',{}));
    toolbar.appendChild(btn);
  }
  area.appendChild(toolbar);
  area.querySelector('#projSearchInp').addEventListener('input',e=>{projectSearch=e.target.value;renderProject();});

  const allProjects=db.projects||[];
  const q=projectSearch.trim().toLowerCase();
  const filtered=q?allProjects.filter(p=>(p.title||'').toLowerCase().includes(q)||(p.clientName||'').toLowerCase().includes(q)):allProjects;
  if(!filtered.length){
    const e=document.createElement('div');
    e.className='asset-empty';
    e.textContent=q?'Tidak ada proyek yang cocok.':'Belum ada proyek.';
    area.appendChild(e); return;
  }

  /* For viewer: validate unlocked members still exist, re-lock if removed */
  if(role!=='admin'){
    let changed=false;
    for(const [projId,info] of unlockedProjects){
      const proj=allProjects.find(p=>p.id===projId);
      if(!proj||!proj.members?.find(m=>m.id===info.memberId)){
        unlockedProjects.delete(projId); changed=true;
      }
    }
    if(changed) saveUnlocked();
  }

  filtered.forEach(proj=>{
    const card=document.createElement('div');
    card.className='proj-card';
    const isExpanded=expandedProjects.has(proj.id);
    const {optimistic:pOpt, pessimistic:pPess}=computeProjectDates(proj);
    const pEnd=pPess||pOpt||proj.startDate;
    const optPct=timelinePercent(proj.startDate,pEnd,pOpt);
    const status=projectStatus(proj);
    const pct=projectProgress(proj);
    const badgeCls=status==='late'?'proj-badge-late':'proj-badge-active';
    const badgeTxt=status==='late'?'Terlambat':'Aktif';

    if(role==='admin'){
      /* ── Admin: full view ── */
      card.innerHTML=`
        <div class="proj-card-head" data-toggle-proj="${proj.id}">
          <span class="proj-chevron${isExpanded?' open':''}">▶</span>
          <div style="flex:1">
            <div class="proj-title">${esc(proj.title)}</div>
            <div class="proj-client">Klien: ${esc(proj.clientName||'—')}</div>
          </div>
          <span class="proj-badge ${badgeCls}">${badgeTxt}</span>
          <div class="proj-actions">
            <button class="asset-act-btn" data-proj-edit="${proj.id}">✎</button>
            <button class="asset-act-btn del" data-proj-del="${proj.id}">✕</button>
          </div>
        </div>
        <div class="proj-meta">
          ${proj.startDate?`<span>Mulai: ${fmtDate(proj.startDate)}</span>`:''}
          ${pOpt?`<span>🎯 Optimis: ${fmtDate(pOpt)}</span>`:''}
          ${pPess&&pPess!==pOpt?`<span>⚠ Pesimis: ${fmtDate(pPess)}</span>`:''}
          <span>${(proj.members||[]).length} anggota · ${pct}% selesai</span>
        </div>
        ${proj.startDate&&pEnd&&pEnd!==proj.startDate?`
        <div class="proj-timeline-wrap">
          <div class="proj-timeline-label">
            <span>${fmtDate(proj.startDate)}</span>
            <span>${fmtDate(pEnd)}</span>
          </div>
          <div class="proj-timeline-bar">
            <div class="proj-tl-optimistic" style="width:${optPct}%"></div>
            <div class="proj-tl-buffer" style="width:${100-optPct}%"></div>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:.58rem;color:var(--dim);margin-top:2px">
            <span></span>
            ${pOpt?`<span>🎯 ${fmtDate(pOpt)}</span>`:''}
          </div>
        </div>`:''}
        <div class="proj-progress"><div class="proj-progress-bar" style="width:${pct}%"></div></div>
      `;
      const collapse=document.createElement('div');
      collapse.className='proj-collapse'+(isExpanded?' open':'');
      const memSec=document.createElement('div');
      memSec.className='proj-member-section';
      (proj.members||[]).forEach(mem=>memSec.appendChild(buildMemberRow(proj,mem,pEnd,true,true)));
      const addMemBtn=document.createElement('button');
      addMemBtn.className='proj-add-btn';
      addMemBtn.style.cssText='margin-left:0;margin-top:8px';
      addMemBtn.textContent='＋ Tambah Anggota';
      addMemBtn.dataset.addMem=proj.id;
      memSec.appendChild(addMemBtn);
      collapse.appendChild(memSec);
      card.appendChild(collapse);
      card.querySelector('[data-toggle-proj]').addEventListener('click',e=>{
        if(e.target.closest('.proj-actions')) return;
        if(expandedProjects.has(proj.id)) expandedProjects.delete(proj.id); else expandedProjects.add(proj.id);
        collapse.classList.toggle('open');
        card.querySelector('.proj-chevron').classList.toggle('open');
      });

    } else {
      /* ── Viewer: locked or unlocked per-project ── */
      const unlockInfo=unlockedProjects.get(proj.id);

      if(!unlockInfo){
        /* Locked card */
        card.innerHTML=`
          <div class="proj-card-head" style="align-items:center">
            <div style="flex:1">
              <div class="proj-title" style="color:var(--muted)">🔒 ${esc(proj.title)}</div>
              <div class="proj-client">Klien: ${esc(proj.clientName||'—')}</div>
            </div>
          </div>
          <div class="proj-lock-form" style="display:none;margin-top:8px">
            <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end">
              <input class="proj-lock-name" type="text" placeholder="Nama lengkap" autocomplete="off"
                style="flex:1;min-width:120px;padding:6px 10px;border-radius:6px;border:1px solid var(--bd);background:var(--surface);color:var(--text);font-size:.78rem;outline:none"/>
              <div style="flex:1;min-width:100px;position:relative">
                <input class="proj-lock-code" type="password" placeholder="Kode klien" maxlength="20"
                  style="width:100%;padding:6px 32px 6px 10px;border-radius:6px;border:1px solid var(--bd);background:var(--surface);color:var(--text);font-size:.78rem;outline:none"/>
                <button class="proj-lock-eye" tabindex="-1"
                  style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);font-size:.72rem;padding:2px">👁</button>
              </div>
              <button class="proj-lock-btn"
                style="padding:6px 14px;border-radius:6px;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:.78rem;font-weight:600;white-space:nowrap">Masuk</button>
            </div>
            <div class="proj-lock-err" style="font-size:.7rem;color:var(--red,#f87171);margin-top:4px;min-height:14px"></div>
          </div>
          <button class="proj-lihat-btn"
            style="margin-top:8px;padding:5px 14px;border-radius:6px;background:transparent;color:var(--accent);border:1px solid var(--accent);cursor:pointer;font-size:.75rem;font-weight:600">Lihat</button>
        `;

        const form=card.querySelector('.proj-lock-form');
        const lihatBtn=card.querySelector('.proj-lihat-btn');
        const nameInp=card.querySelector('.proj-lock-name');
        const codeInp=card.querySelector('.proj-lock-code');
        const eyeBtn=card.querySelector('.proj-lock-eye');
        const lockBtn=card.querySelector('.proj-lock-btn');
        const errEl=card.querySelector('.proj-lock-err');

        lihatBtn.addEventListener('click',()=>{
          form.style.display=''; lihatBtn.style.display='none'; nameInp.focus();
        });
        eyeBtn.addEventListener('click',()=>{
          codeInp.type=codeInp.type==='password'?'text':'password';
        });

        function tryUnlock(){
          const name=(nameInp.value||'').trim();
          const code=(codeInp.value||'').trim();
          if(!name||!code){ errEl.textContent='Isi nama dan kode klien.'; return; }
          if(proj.clientCode===code){
            const mem=(proj.members||[]).find(m=>m.name.toLowerCase()===name.toLowerCase());
            if(mem){
              unlockedProjects.set(proj.id,{memberName:name,memberId:mem.id});
              saveUnlocked(); renderProject(); return;
            }
          }
          errEl.textContent='Nama atau kode tidak sesuai.';
          codeInp.classList.add('error');
          setTimeout(()=>{codeInp.classList.remove('error');errEl.textContent=''},1800);
        }
        lockBtn.addEventListener('click',tryUnlock);
        codeInp.addEventListener('keydown',e=>{if(e.key==='Enter')tryUnlock()});
        nameInp.addEventListener('keydown',e=>{if(e.key==='Enter')codeInp.focus()});

      } else {
        /* Unlocked card — show this member's content */
        const mem=(proj.members||[]).find(m=>m.id===unlockInfo.memberId);
        card.innerHTML=`
          <div class="proj-card-head" data-toggle-proj="${proj.id}">
            <span class="proj-chevron${isExpanded?' open':''}">▶</span>
            <div style="flex:1">
              <div class="proj-title">${esc(proj.title)}</div>
              <div class="proj-client">Klien: ${esc(proj.clientName||'—')}</div>
            </div>
            <span class="proj-badge ${badgeCls}">${badgeTxt}</span>
            <button class="proj-relock-btn" title="Kunci kembali"
              style="background:none;border:none;cursor:pointer;color:var(--dim);font-size:.82rem;padding:4px;margin-left:4px">🔓</button>
          </div>
          <div class="proj-meta">
            ${proj.startDate?`<span>Mulai: ${fmtDate(proj.startDate)}</span>`:''}
            ${pOpt?`<span>🎯 Optimis: ${fmtDate(pOpt)}</span>`:''}
            ${pPess&&pPess!==pOpt?`<span>⚠ Pesimis: ${fmtDate(pPess)}</span>`:''}
            <span>${(proj.members||[]).length} anggota · ${pct}% selesai</span>
          </div>
          ${proj.startDate&&pEnd&&pEnd!==proj.startDate?`
          <div class="proj-timeline-wrap">
            <div class="proj-timeline-label">
              <span>${fmtDate(proj.startDate)}</span>
              <span>${fmtDate(pEnd)}</span>
            </div>
            <div class="proj-timeline-bar">
              <div class="proj-tl-optimistic" style="width:${optPct}%"></div>
              <div class="proj-tl-buffer" style="width:${100-optPct}%"></div>
            </div>
          </div>`:''}
          <div class="proj-progress"><div class="proj-progress-bar" style="width:${pct}%"></div></div>
        `;
        card.querySelector('.proj-relock-btn').addEventListener('click',()=>{
          unlockedProjects.delete(proj.id); saveUnlocked(); renderProject();
        });
        if(mem){
          const collapse2=document.createElement('div');
          collapse2.className='proj-collapse'+(isExpanded?' open':'');
          const memSec=document.createElement('div');
          memSec.className='proj-member-section';
          memSec.appendChild(buildMemberRow(proj,mem,pEnd,true,false));
          collapse2.appendChild(memSec);
          card.appendChild(collapse2);
          card.querySelector('[data-toggle-proj]').addEventListener('click',e=>{
            if(e.target.closest('.proj-relock-btn')) return;
            if(expandedProjects.has(proj.id)) expandedProjects.delete(proj.id); else expandedProjects.add(proj.id);
            collapse2.classList.toggle('open');
            card.querySelector('.proj-chevron').classList.toggle('open');
          });
        }
      }
    }

    area.appendChild(card);
  });

  /* Event delegation for all dynamically rendered buttons */
  area.querySelectorAll('[data-proj-edit]').forEach(b=>b.addEventListener('click',()=>openModal('proj-edit',{id:b.dataset.projEdit})));
  area.querySelectorAll('[data-proj-del]').forEach(b=>b.addEventListener('click',()=>{
    const p=db.projects.find(x=>x.id===b.dataset.projDel);
    if(!p||!confirm(`Hapus proyek "${p.title}"?`)) return;
    db.projects=db.projects.filter(x=>x.id!==p.id); save(); renderProject();
  }));
  area.querySelectorAll('[data-task-toggle]').forEach(b=>b.addEventListener('click',()=>{
    const proj=db.projects.find(x=>x.id===b.dataset.proj);
    const mem=proj?.members?.find(m=>m.id===b.dataset.mem);
    const task=mem?.tasks?.find(t=>t.id===b.dataset.taskToggle);
    if(!task) return;
    task.done=!task.done; save(); renderProject();
  }));
  area.querySelectorAll('[data-task-add]').forEach(b=>b.addEventListener('click',()=>openModal('proj-task-add',{projId:b.dataset.proj,memberId:b.dataset.taskAdd})));
  area.querySelectorAll('[data-task-edit]').forEach(b=>b.addEventListener('click',()=>openModal('proj-task-edit',{projId:b.dataset.proj,memberId:b.dataset.mem,taskId:b.dataset.taskEdit})));
  area.querySelectorAll('[data-task-del]').forEach(b=>b.addEventListener('click',()=>{
    const proj=db.projects.find(x=>x.id===b.dataset.proj);
    const mem=proj?.members?.find(m=>m.id===b.dataset.mem);
    if(!mem||!confirm('Hapus tugas ini?')) return;
    mem.tasks=(mem.tasks||[]).filter(t=>t.id!==b.dataset.taskDel); save(); renderProject();
  }));
  area.querySelectorAll('[data-mem-edit]').forEach(b=>b.addEventListener('click',()=>openModal('proj-mem-edit',{projId:b.dataset.proj,memberId:b.dataset.memEdit})));
  area.querySelectorAll('[data-mem-del]').forEach(b=>b.addEventListener('click',()=>{
    const proj=db.projects.find(x=>x.id===b.dataset.proj);
    const mem=proj?.members?.find(m=>m.id===b.dataset.memDel);
    if(!mem||!confirm(`Hapus anggota "${mem.name}" dari proyek ini?`)) return;
    proj.members=proj.members.filter(m=>m.id!==mem.id); save(); renderProject();
  }));
  area.querySelectorAll('[data-add-mem]').forEach(b=>b.addEventListener('click',()=>openModal('proj-mem-add',{projId:b.dataset.addMem})));
}
