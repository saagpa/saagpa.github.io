<html lang="id">
<head>
<meta charset="UTF-8"/>

<title>FGD — Laravel Dungeon: Developer Awakening</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08080f;--surface:#0f0f1a;--card:#14141f;--bd:#1e1e30;
  --text:#eaeaf8;--muted:#8888b0;--dim:#4a4a6a;
  --font:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;

  --c-gold:#fbbf24;   --c-gold-dim:rgba(251,191,36,.12);
  --c-blue:#60a5fa;   --c-blue-dim:rgba(96,165,250,.12);
  --c-green:#34d399;  --c-green-dim:rgba(52,211,153,.12);
  --c-teal:#2dd4bf;   --c-teal-dim:rgba(45,212,191,.12);
  --c-purple:#c084fc; --c-purple-dim:rgba(192,132,252,.12);
  --c-orange:#fb923c; --c-orange-dim:rgba(251,146,60,.12);
  --c-red:#f87171;    --c-red-dim:rgba(248,113,113,.12);
}

html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font)}
body{display:flex;flex-direction:column}

/* ── Top bar ── */
.topbar{
  flex-shrink:0;display:flex;align-items:center;gap:12px;
  padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--bd);
  z-index:10;
}
.tb-title{font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tb-spacer{flex:1}
.tb-progress{font-size:.75rem;font-family:var(--mono);color:var(--muted)}
.tb-progress strong{color:var(--text)}
.tb-btn{
  display:flex;align-items:center;gap:5px;font-size:.7rem;font-weight:600;color:var(--muted);
  padding:4px 10px;border:1px solid var(--bd);border-radius:5px;background:var(--card);
  cursor:pointer;transition:all .15s;
}
.tb-btn:hover{color:var(--text);border-color:var(--bd)}
.tb-btn.active{background:var(--bd);color:var(--text)}

/* ── Card stage ── */
.stage{flex:1;position:relative;overflow:hidden}

.card{
  position:absolute;inset:0;
  display:flex;flex-direction:column;justify-content:center;
  padding:clamp(28px,5vw,64px) clamp(28px,8vw,120px);
  opacity:0;pointer-events:none;
  transform:translateX(60px);
  transition:opacity .28s cubic-bezier(.4,0,.2,1), transform .28s cubic-bezier(.4,0,.2,1);
}
.card.active{opacity:1;pointer-events:all;transform:none}
.card.exit-left{opacity:0;transform:translateX(-60px)}

/* Category badge */
.cat-badge{
  display:inline-flex;align-items:center;gap:7px;
  font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  padding:5px 13px;border-radius:20px;border-width:1px;border-style:solid;
  margin-bottom:clamp(20px,3vw,36px);width:fit-content;
}

/* Card type: INFO */
.card.info .cat-badge{color:var(--c-gold);background:var(--c-gold-dim);border-color:rgba(251,191,36,.25)}
.card.info .cat-dot{background:var(--c-gold)}
/* PENGALAMAN */
.card.pengalaman .cat-badge{color:var(--c-blue);background:var(--c-blue-dim);border-color:rgba(96,165,250,.25)}
.card.pengalaman .cat-dot{background:var(--c-blue)}
/* PEMBELAJARAN */
.card.pembelajaran .cat-badge{color:var(--c-green);background:var(--c-green-dim);border-color:rgba(52,211,153,.25)}
.card.pembelajaran .cat-dot{background:var(--c-green)}
/* MINI PROJECT */
.card.miniproject .cat-badge{color:var(--c-teal);background:var(--c-teal-dim);border-color:rgba(45,212,191,.25)}
.card.miniproject .cat-dot{background:var(--c-teal)}
/* MEKANIK */
.card.mekanik .cat-badge{color:var(--c-purple);background:var(--c-purple-dim);border-color:rgba(192,132,252,.25)}
.card.mekanik .cat-dot{background:var(--c-purple)}
/* DESAIN */
.card.desain .cat-badge{color:var(--c-orange);background:var(--c-orange-dim);border-color:rgba(251,146,60,.25)}
.card.desain .cat-dot{background:var(--c-orange)}
/* PENUTUP */
.card.penutup .cat-badge{color:var(--c-red);background:var(--c-red-dim);border-color:rgba(248,113,113,.25)}
.card.penutup .cat-dot{background:var(--c-red)}

.cat-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* Main question */
.q-main{
  font-size:clamp(1.4rem,3.5vw,2.5rem);
  font-weight:800;line-height:1.25;letter-spacing:-.025em;
  color:var(--text);
  text-wrap:balance;
  margin-bottom:clamp(20px,3vw,36px);
  max-width:820px;
}

/* Probes */
.q-probes{display:flex;flex-direction:column;gap:10px;margin-bottom:clamp(20px,3vw,36px)}
.probe{
  display:flex;align-items:baseline;gap:12px;
  font-size:clamp(.85rem,1.5vw,1.05rem);color:var(--muted);line-height:1.55;
}
.probe-num{
  font-family:var(--mono);font-size:.72rem;font-weight:600;
  width:22px;flex-shrink:0;text-align:right;opacity:.5;
}

/* Facilitator note */
.note{
  display:flex;align-items:flex-start;gap:10px;
  padding:10px 14px;border-radius:8px;border:1px solid var(--bd);
  background:rgba(255,255,255,.02);max-width:640px;margin-top:8px;
}
.note-icon{font-size:.8rem;flex-shrink:0;margin-top:1px;opacity:.6}
.note-text{font-size:.75rem;color:var(--dim);line-height:1.6;font-style:italic}

/* Special: info card */
.info-block{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;max-width:680px;margin-bottom:28px;
}
.info-item{
  background:rgba(255,255,255,.03);border:1px solid var(--bd);
  border-radius:8px;padding:12px 14px;
}
.info-item-label{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:4px}
.info-item-val{font-size:.88rem;font-weight:600;color:var(--text)}

/* ── Bottom nav ── */
.nav-bar{
  flex-shrink:0;display:flex;align-items:center;gap:12px;
  padding:12px 20px;background:var(--surface);border-top:1px solid var(--bd);
}
.nav-bar .prog-track{flex:1;height:3px;background:var(--bd);border-radius:2px;overflow:hidden}
.nav-bar .prog-fill{height:100%;border-radius:2px;transition:width .3s ease;background:var(--c-blue)}
.nav-btn{
  display:flex;align-items:center;gap:6px;
  font-size:.78rem;font-weight:600;padding:8px 18px;border-radius:7px;
  border:1px solid var(--bd);background:var(--card);color:var(--muted);
  cursor:pointer;transition:all .15s;
}
.nav-btn:hover:not(:disabled){color:var(--text);border-color:rgba(255,255,255,.15)}
.nav-btn:disabled{opacity:.25;cursor:default}
.nav-btn.primary{background:rgba(96,165,250,.15);border-color:rgba(96,165,250,.3);color:var(--c-blue)}
.nav-btn.primary:hover:not(:disabled){background:rgba(96,165,250,.25)}
.nav-hint{font-size:.65rem;color:var(--dim);white-space:nowrap}

/* ── Grid overview ── */
.overview{
  position:fixed;inset:0;z-index:50;
  background:rgba(8,8,15,.96);backdrop-filter:blur(12px);
  overflow-y:auto;padding:32px 24px 60px;
  display:none;
}
.overview.open{display:block}
.overview-title{font-size:1.1rem;font-weight:800;margin-bottom:24px;color:var(--text)}
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.ov-card{
  background:var(--card);border:1px solid var(--bd);border-radius:10px;
  padding:14px 16px;cursor:pointer;transition:all .15s;
  display:flex;flex-direction:column;gap:7px;
}
.ov-card:hover{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.04)}
.ov-card.current{border-color:var(--c-blue);background:rgba(96,165,250,.06)}
.ov-num{font-family:var(--mono);font-size:.62rem;color:var(--dim)}
.ov-cat{font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.ov-q{font-size:.75rem;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── Keyboard shortcut overlay ── */
.shortcuts{
  position:fixed;bottom:70px;right:20px;z-index:20;
  background:var(--surface);border:1px solid var(--bd);border-radius:10px;
  padding:12px 16px;display:none;min-width:180px;
}
.shortcuts.open{display:block}
.sc-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:3px 0}
.sc-key{font-family:var(--mono);font-size:.68rem;color:var(--text);background:var(--bd);padding:2px 6px;border-radius:3px}
.sc-desc{font-size:.68rem;color:var(--muted)}

@media(max-width:600px){
  .q-main{font-size:1.3rem}
  .card{padding:24px 20px}
  .nav-hint,.tb-title{display:none}
}

@media(prefers-reduced-motion:reduce){
  .card{transition:opacity .15s}
}
</style>
</head>

/* ═══════════════════════════════════════════════════════
   RENDERER
═══════════════════════════════════════════════════════ */
function buildCard(card, idx) {
  const el = document.createElement('div');
  el.className = `card ${card.type}`;
  el.dataset.idx = idx;

  let inner = `
    <div class="cat-badge">
      <span class="cat-dot"></span>
      ${card.cat}
    </div>
    <div class="q-main">${card.q}</div>
  `;

  if (card.info) {
    inner += `<div class="info-block">${card.info.map(i =>
      `<div class="info-item">
        <div class="info-item-label">${i.label}</div>
        <div class="info-item-val">${i.val}</div>
      </div>`
    ).join('')}</div>`;
  }

  if (card.probes && card.probes.length) {
    inner += `<div class="q-probes">${card.probes.map((p, i) =>
      `<div class="probe">
        <span class="probe-num">${i + 1}.</span>
        <span>${p}</span>
      </div>`
    ).join('')}</div>`;
  }

  if (card.facilitatorNote) {
    inner += `<div class="note">
      <span class="note-icon">🗒️</span>
      <span class="note-text"><strong>Catatan fasilitator:</strong> ${card.facilitatorNote}</span>
    </div>`;
  }

  el.innerHTML = inner;
  return el;
}

   NAVIGATION STATE
═══════════════════════════════════════════════════════ */
let current = 0;
const stage = document.getElementById('stage');

// Render all cards
CARDS.forEach((card, i) => {
  const el = buildCard(card, i);
  if (i === 0) el.classList.add('active');
  stage.appendChild(el);
});

// Build grid
const ovGrid = document.getElementById('ov-grid');
CARDS.forEach((card, i) => {
  const el = document.createElement('div');
  el.className = `ov-card${i === 0 ? ' current' : ''}`;
  el.dataset.idx = i;
  el.innerHTML = `
    <div class="ov-num">${String(i+1).padStart(2,'0')}</div>
    <div class="ov-cat" style="color:${catColor(card.type)}">${card.cat}</div>
    <div class="ov-q">${card.q}</div>
  `;
  el.addEventListener('click', () => goTo(i));
  ovGrid.appendChild(el);
});

function catColor(type) {
  const map = {
    info:'var(--c-gold)', pengalaman:'var(--c-blue)', pembelajaran:'var(--c-green)',
    miniproject:'var(--c-teal)', mekanik:'var(--c-purple)', desain:'var(--c-orange)', penutup:'var(--c-red)'
  };
  return map[type] || 'var(--c-blue)';
}

function updateUI() {
  document.getElementById('curr-num').textContent = current + 1;
  document.getElementById('total-num').textContent = CARDS.length;
  document.getElementById('prog-fill').style.width = `${((current + 1) / CARDS.length) * 100}%`;
  document.getElementById('btn-prev').disabled = current === 0;
  document.getElementById('btn-next').disabled = current === CARDS.length - 1;

  // Update grid current marker
  document.querySelectorAll('.ov-card').forEach((el, i) => {
    el.classList.toggle('current', i === current);
  });

  // Update progress bar color by category
  const type = CARDS[current].type;
  document.getElementById('prog-fill').style.background = catColor(type);
}

function navigate(dir) {
  const target = current + dir;
  if (target < 0 || target >= CARDS.length) return;
  goTo(target);
}

function goTo(idx) {
  const cards = stage.querySelectorAll('.card');
  const dir = idx > current ? 1 : -1;

  // Exit current
  cards[current].classList.remove('active');
  cards[current].style.transform = dir > 0 ? 'translateX(-60px)' : 'translateX(60px)';
  cards[current].style.opacity = '0';

  // Cleanup old after transition
  const exiting = current;
  setTimeout(() => {
    cards[exiting].style.transform = '';
    cards[exiting].style.opacity = '';
  }, 300);

  current = idx;

  // Enter new card
  cards[current].style.transform = dir > 0 ? 'translateX(60px)' : 'translateX(-60px)';
  cards[current].style.opacity = '0';
  cards[current].classList.add('active');

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      cards[current].style.transform = 'translateX(0)';
      cards[current].style.opacity = '1';
    });
  });

  updateUI();

  // Close grid if open
  if (document.getElementById('overview').classList.contains('open')) {
    toggleGrid();
  }
}

/* ═══════════════════════════════════════════════════════
   OVERLAYS
═══════════════════════════════════════════════════════ */
function toggleGrid() {
  const ov = document.getElementById('overview');
  const btn = document.getElementById('btn-grid');
  ov.classList.toggle('open');
  btn.classList.toggle('active');
  // Scroll current card into view in grid
  const cur = ovGrid.children[current];
  if (ov.classList.contains('open') && cur) {
    cur.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

function toggleShortcuts() {
  document.getElementById('shortcuts').classList.toggle('open');
  document.getElementById('btn-sc').classList.toggle('active');
}

/* ═══════════════════════════════════════════════════════
   KEYBOARD
═══════════════════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  const ov = document.getElementById('overview');
  if (e.key === 'Escape') {
    if (ov.classList.contains('open')) toggleGrid();
    if (document.getElementById('shortcuts').classList.contains('open')) toggleShortcuts();
    return;
  }
  if (e.key === 'g' || e.key === 'G') { toggleGrid(); return; }
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') navigate(1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   navigate(-1);
  if (e.key === 'Home') goTo(0);
  if (e.key === 'End')  goTo(CARDS.length - 1);
});

/* Touch swipe */
let touchStartX = 0;
stage.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
stage.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) navigate(dx < 0 ? 1 : -1);
});

/* Click stage to advance */
stage.addEventListener('click', e => {
  if (e.target.closest('.note')) return;
  const x = e.clientX / window.innerWidth;
  navigate(x > 0.5 ? 1 : -1);
});

updateUI();
</script>
</body>
</html>
