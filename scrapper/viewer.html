<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Script Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090f;--surface:#0f0f18;--bd:rgba(255,255,255,.08);
  --text:#e2e2ee;--muted:#8888aa;--accent:#6366f1;
  --font-sans:'Inter',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --r-sm:7px;--r-md:10px;--r-lg:14px;
}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font-sans)}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--accent);border-radius:3px}

#dion-nav{
  position:sticky;top:0;z-index:99;
  display:flex;align-items:center;gap:10px;
  padding:9px 24px;
  background:rgba(9,9,15,.95);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--bd);font-size:.72rem;
}
#dion-nav a.back{
  display:flex;align-items:center;gap:6px;font-weight:600;
  color:var(--muted);padding:4px 11px;border-radius:var(--r-sm);
  border:1px solid var(--bd);text-decoration:none;
  transition:color .18s,border-color .18s;
}
#dion-nav a.back:hover{color:var(--accent);border-color:rgba(99,102,241,.3)}
.nav-title{color:rgba(255,255,255,.25);font-family:var(--font-mono);font-size:.68rem}

#content{max-width:780px;margin:0 auto;padding:2.5rem 1.5rem 4rem}

/* ── Markdown styles ── */
#md h1{font-size:1.5rem;font-weight:800;color:#fff;margin-bottom:1.2rem;line-height:1.25}
#md h2{font-size:1.1rem;font-weight:700;color:#fff;margin:2rem 0 .7rem;
  padding-bottom:.4rem;border-bottom:1px solid var(--bd)}
#md h3{font-size:.95rem;font-weight:600;color:rgba(255,255,255,.85);margin:1.4rem 0 .5rem}
#md h4{font-size:.85rem;font-weight:600;color:var(--muted);margin:1rem 0 .4rem;text-transform:uppercase;letter-spacing:.06em}
#md p{font-size:.85rem;color:rgba(255,255,255,.62);line-height:1.75;margin-bottom:.75rem}
#md ul,#md ol{padding-left:1.3rem;margin-bottom:.75rem}
#md li{font-size:.85rem;color:rgba(255,255,255,.62);line-height:1.7;margin-bottom:.2rem}
#md li strong{color:rgba(255,255,255,.85)}
#md strong{color:rgba(255,255,255,.88);font-weight:600}
#md em{color:rgba(255,255,255,.55);font-style:italic}
#md a{color:#6366f1;text-decoration:underline;text-underline-offset:3px}
#md a:hover{color:#818cf8}
#md code{
  font-family:var(--font-mono);font-size:.8rem;
  background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.18);
  padding:1px 6px;border-radius:4px;color:#a5b4fc;
}
#md pre{
  background:#0d0d1a;border:1px solid var(--bd);border-radius:var(--r-lg);
  padding:1.1rem 1.2rem;margin:.8rem 0 1rem;overflow-x:auto;
}
#md pre code{
  background:none;border:none;padding:0;color:#c7d2fe;font-size:.78rem;line-height:1.65;
}
#md blockquote{
  border-left:3px solid var(--accent);padding:.5rem .9rem;
  background:rgba(99,102,241,.06);border-radius:0 var(--r-sm) var(--r-sm) 0;
  margin:.75rem 0;color:rgba(255,255,255,.55);font-size:.83rem;
}
#md hr{border:none;border-top:1px solid var(--bd);margin:1.5rem 0}
#md table{width:100%;border-collapse:collapse;margin:.75rem 0;font-size:.8rem}
#md th{background:rgba(255,255,255,.04);color:rgba(255,255,255,.7);font-weight:600;
  padding:.5rem .75rem;border:1px solid var(--bd);text-align:left}
#md td{padding:.45rem .75rem;border:1px solid var(--bd);color:rgba(255,255,255,.55)}

#loading{text-align:center;padding:4rem 0;color:var(--muted);font-size:.85rem;font-family:var(--font-mono)}
#error{text-align:center;padding:4rem 0;color:#f87171;font-size:.85rem}
@keyframes pin-shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pin-shaking{animation:pin-shake .35s ease}
</style>
</head>
<body>

<!-- PIN GATE -->
<div id="pin-gate" style="position:fixed;inset:0;z-index:9999;background:#09090f;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif">
  <div id="pin-box" style="display:flex;flex-direction:column;align-items:center;gap:1rem;width:100%;max-width:320px;padding:2.5rem 2rem;background:#0f0f18;border:1px solid rgba(255,255,255,.09);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.6)">
    <div style="font-size:2rem;line-height:1">🔐</div>
    <div style="font-size:1.05rem;font-weight:700;color:#fff">Akses Terbatas</div>
    <div style="font-size:.78rem;color:rgba(255,255,255,.35);text-align:center">Masukkan kode untuk membuka script ini</div>
    <div style="position:relative;width:100%">
      <input id="pin-input" type="password" maxlength="32" placeholder="Kode akses"
        style="width:100%;padding:.65rem 2.6rem .65rem .9rem;background:#09090f;border:1px solid rgba(255,255,255,.12);border-radius:8px;color:#fff;font-size:.9rem;font-family:'JetBrains Mono',monospace;text-align:center;letter-spacing:.2em;outline:none"
        onfocus="this.style.borderColor='rgba(99,102,241,.5)'" onblur="this.style.borderColor='rgba(255,255,255,.12)'"/>
      <button id="eye-btn" type="button" onclick="togglePinEye()"
        style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:rgba(255,255,255,.3);padding:4px;display:flex;align-items:center"
        onmouseenter="this.style.color='rgba(255,255,255,.7)'" onmouseleave="this.style.color='rgba(255,255,255,.3)'">
        <svg id="eye-icon" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
      </button>
    </div>
    <div style="font-size:.65rem;color:rgba(255,255,255,.2);margin-top:-.4rem">Petunjuk: kelahiran Aliria</div>
    <button onclick="checkPin()" style="width:100%;padding:.65rem;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:8px;color:#fff;font-size:.82rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif">Masuk →</button>
    <div id="pin-error" style="font-size:.72rem;color:#f87171;min-height:1em"></div>
  </div>
</div>

<div id="dion-nav">
  <a href="../index.html" class="back">
    <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 12H5m7-7l-7 7 7 7"/></svg>
    Beranda
  </a>
  <span class="nav-title" id="nav-title">/ Script</span>
</div>

<div id="content">
  <div id="loading">memuat script...</div>
  <div id="md"></div>
  <div id="error" style="display:none"></div>
</div>

<script>
// ── PIN GATE ──────────────────────────────────────────────────────────────────
// Ganti GATE_HASH dengan hasil: pinHelper("kode_baru") di console browser
const GATE_HASH = '6e65b61d030e5ac6492802c6f619a63006e5b0e2cafc0170ab92a68083162528';
const GATE_KEY  = 'gate_dion_v1';

function _hash(s) { return CryptoJS.SHA256(s).toString(); }
window.pinHelper = s => { const h = _hash(s); console.log('Hash untuk "'+s+'":\n'+h); return h; };

function togglePinEye() {
  const inp = document.getElementById('pin-input');
  const icon = document.getElementById('eye-icon');
  if (inp.type === 'password') {
    inp.type = 'text';
    icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>';
  } else {
    inp.type = 'password';
    icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>';
  }
}

function checkPin() {
  const val = document.getElementById('pin-input').value.trim();
  if (!val) return;
  if (_hash(val) === GATE_HASH) {
    sessionStorage.setItem(GATE_KEY, '1');
    const gate = document.getElementById('pin-gate');
    gate.style.transition = 'opacity .25s';
    gate.style.opacity = '0';
    setTimeout(() => { gate.remove(); document.body.style.overflow = ''; }, 260);
  } else {
    document.getElementById('pin-error').textContent = 'Kode salah, coba lagi.';
    const box = document.getElementById('pin-box');
    box.classList.add('pin-shaking');
    setTimeout(() => box.classList.remove('pin-shaking'), 360);
    document.getElementById('pin-input').value = '';
    document.getElementById('pin-input').focus();
  }
}

(function initGate() {
  if (sessionStorage.getItem(GATE_KEY)) {
    document.getElementById('pin-gate')?.remove();
    return;
  }
  document.body.style.overflow = 'hidden';
  document.getElementById('pin-input')?.focus();
  document.getElementById('pin-input')?.addEventListener('keydown', e => {
    if (e.key === 'Enter') checkPin();
  });
})();

// ── Script loader ──────────────────────────────────────────────────────────────
const SCRIPTS = {
  kemendikdasmen: { label:'Kemendikdasmen — Data Sekolah',    path:'kemendikdasmen/script.md' },
  btnproperti:    { label:'BTN Properti — Developer List',    path:'btnproperti/script.md'    },
  sisparnas:      { label:'SISPARNAS — DTW',                  path:'sisparnas/script.md'      },
  whatsappgroup:  { label:'WhatsApp Group — Crawling Safety', path:'whatsappgroup/script.md'  },
};

const params = new URLSearchParams(location.search);
const key    = params.get('s');
const meta   = SCRIPTS[key];

if (!meta) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error').style.display   = 'block';
  document.getElementById('error').textContent = 'Script tidak ditemukan.';
} else {
  document.title = meta.label + ' — Script Viewer';
  document.getElementById('nav-title').textContent = '/ ' + meta.label;

  fetch(meta.path)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(md => {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('md').innerHTML = marked.parse(md);
    })
    .catch(() => {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display   = 'block';
      document.getElementById('error').textContent = 'Gagal memuat file script.md';
    });
}
</script>
</body>
</html>
